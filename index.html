function escapeHtml(s){
  if (s == null) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function fmt$(n){
  if (n == null || n === '') return '—';
  const x = Number(n);
  if (Number.isNaN(x)) return '—';
  return x >= 1 ? '$' + x.toFixed(2) : '$' + x.toFixed(3);
}
function fmtBig(n){
  if(n>=1e9) return '$'+(n/1e9).toFixed(1)+'B';
  if(n>=1e6) return '$'+(n/1e6).toFixed(1)+'M';
  if(n>=1e3) return '$'+Math.round(n/1e3)+'K';
  return '$'+Math.round(n);
}

let lastRightRes = null;
let lastOptimizeRes = null;
let optimizeProgressTimer = null;
let optimizeClientLogTimer = null;
let pipelineLogDrawerOpen = false;
let tickerTimer = null;
let tickerLines = [];

function tickerAddLine(msg) {
  const wrap = document.getElementById('pipeTickerWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'pipe-ticker-line';
  el.textContent = '› ' + msg;
  wrap.appendChild(el);
  // previous lines: remove current, add dim
  Array.from(wrap.children).forEach(function(c, i, arr) {
    if (i < arr.length - 1) {
      c.classList.remove('current');
      c.classList.add('dim');
    }
  });
  requestAnimationFrame(function() {
    el.classList.add('visible');
    el.classList.add('current');
    wrap.scrollTop = wrap.scrollHeight;
  });
}

function clearTicker() {
  const wrap = document.getElementById('pipeTickerWrap');
  if (wrap) wrap.innerHTML = '';
  if (tickerTimer) { clearInterval(tickerTimer); tickerTimer = null; }
  tickerLines = [];
}

function replayLogAsTicker(entries) {
  clearTicker();
  let i = 0;
  function next() {
    if (i >= entries.length) return;
    tickerAddLine(entries[i++].msg || '');
    tickerTimer = setTimeout(next, 180);
  }
  next();
}

function pipelineLogStamp() {
  return new Date().toISOString().slice(11, 23);
}

function appendPipelineLogLine(t, msg) {
  const ts = t != null && String(t).trim() ? String(t).trim() : pipelineLogStamp();
  const body = document.getElementById('pipelineLogBody');
  if (!body) return;
  const first = body.firstElementChild;
  if (first && /Run Optimize|append entries/i.test(first.textContent || '')) {
    first.remove();
  }
  const line = document.createElement('div');
  line.className = 'pld-line';
  line.innerHTML = '<span class="pld-t">' + escapeHtml(ts) + '</span>' + escapeHtml(msg || '');
  body.appendChild(line);
  if (pipelineLogDrawerOpen) body.scrollTop = body.scrollHeight;
}

function resetPipelineLogUi() {
  const body = document.getElementById('pipelineLogBody');
  if (body) body.innerHTML = '';
}

function startOptimizeClientLog() {
  if (optimizeClientLogTimer) {
    clearInterval(optimizeClientLogTimer);
    optimizeClientLogTimer = null;
  }
  resetPipelineLogUi();
  appendPipelineLogLine(null, 'POST /optimize …');
  const hints = [
    'Decomposing query…', 'Signals & routing…', 'Generating sub-queries…',
    'Free search & RAG…', 'Scoring hits…', 'Price fetch: probing paid sources…',
    'Evaluating coverage gaps…', 'Building purchase plan…',
    'Running research critic…', 'Running writer synthesis…',
    'Formatting answer…', 'Scoring bid schedule…', 'Packaging results…',
  ];
  let i = 0;
  optimizeClientLogTimer = setInterval(function () {
    if (i < hints.length) appendPipelineLogLine(null, hints[i++]);
  }, 2200);
}

function stopOptimizeClientLog() {
  if (optimizeClientLogTimer) {
    clearInterval(optimizeClientLogTimer);
    optimizeClientLogTimer = null;
  }
}

function mergeServerPipelineLog(res) {
  const pl = (res.v4 || {}).pipeline_log;
  if (!Array.isArray(pl) || !pl.length) return;
  appendPipelineLogLine(null, '— server log —');
  pl.forEach(function (e) {
    appendPipelineLogLine(e.t, e.msg || '');
  });
  replayLogAsTicker(pl);
}

function togglePipelineLogDrawer() {
  const dr = document.getElementById('pipelineLogDrawer');
  if (!dr) return;
  const on = !dr.classList.contains('on');
  dr.classList.toggle('on', on);
  dr.setAttribute('aria-hidden', on ? 'false' : 'true');
  pipelineLogDrawerOpen = on;
  const body = document.getElementById('pipelineLogBody');
  if (on && body) body.scrollTop = body.scrollHeight;
}

function closePipelineLogDrawer() {
  const dr = document.getElementById('pipelineLogDrawer');
  if (!dr) return;
  dr.classList.remove('on');
  dr.setAttribute('aria-hidden', 'true');
  pipelineLogDrawerOpen = false;
}

function startOptimizeProgress(){
  stopOptimizeProgress(false);
  const wrap = document.getElementById('pipeProgressWrap');
  const fill = document.getElementById('pipeProgressFill');
  const lab = document.getElementById('pipeProgressLabel');
  if (!wrap || !fill || !lab) return;
  wrap.classList.add('on');
  lab.textContent = 'Starting…';
  fill.style.width = '3%';
  const t0 = Date.now();
  const labels = ['Decomposing…', 'Signals & routing…', 'Search & RAG…', 'Price fetch & plan…', 'Writing answer…', 'Finishing…'];
  const span = 120000;
  clearTicker();
  const hints = [
    'Decomposing query into sub-tasks…',
    'Detecting intent & routing signals…',
    'Generating sub-queries…',
    'Free search + RAG retrieval…',
    'Scoring & filtering hits…',
    'Price fetch: probing paid sources…',
    'Evaluating coverage gaps…',
    'Building purchase plan…',
    'Running research critic…',
    'Running writer synthesis…',
    'Formatting answer…',
    'Scoring bid schedule…',
    'Packaging results…',
  ];
  // First 10 hints at 2800ms each; final 3 (finishing phase) at 3500ms each
  const hintDelays = hints.map((_, i) => i < 10 ? 2800 : 3500);
  let hi = 0;
  let hintStopped = false;
  tickerAddLine(hints[hi++]);
  function scheduleNextHint() {
    if (hintStopped || hi >= hints.length) return;
    setTimeout(function() {
      if (hintStopped) return;
      tickerAddLine(hints[hi++]);
      scheduleNextHint();
    }, hintDelays[hi]);
  }
  scheduleNextHint();
  function tick(){
    const elapsed = Date.now() - t0;
    const pct = Math.min(97, 3 + (1 - Math.exp(-elapsed / 24000)) * 94);
    fill.style.width = pct.toFixed(1) + '%';
    const li = Math.min(labels.length - 1, Math.floor(elapsed / (span / labels.length)));
    lab.textContent = labels[li];
  }
  tick();
  optimizeProgressTimer = setInterval(tick, 320);
  optimizeProgressTimer._stopHints = function() { hintStopped = true; };
}

/** @param {boolean} [done] If true, fill to 100% and label Done (hidden when results render). */
function stopOptimizeProgress(done){
  if (optimizeProgressTimer){
    if (optimizeProgressTimer._stopHints) optimizeProgressTimer._stopHints();
    clearInterval(optimizeProgressTimer);
    optimizeProgressTimer = null;
  }
  const wrap = document.getElementById('pipeProgressWrap');
  const fill = document.getElementById('pipeProgressFill');
  const lab = document.getElementById('pipeProgressLabel');
  if (!wrap || !fill) return;
  if (done){
    fill.style.width = '100%';
    if (lab) lab.textContent = 'Done';
    return;
  }
  wrap.classList.remove('on');
  fill.style.width = '0%';
  if (lab) lab.textContent = 'Starting…';
}

function hidePipeProgress(){
  const wrap = document.getElementById('pipeProgressWrap');
  const fill = document.getElementById('pipeProgressFill');
  const lab = document.getElementById('pipeProgressLabel');
  if (wrap){
    wrap.classList.remove('on');
    if (fill) fill.style.width = '0%';
    if (lab) lab.textContent = 'Starting…';
  }
}

function renderPipelineLoading(){
  startOptimizeProgress();
}

function renderPipelineViz(res){
  hidePipeProgress();
  lastOptimizeRes = res;
}

  }
}

function buildPipelineRightBlock(res){
  const v4 = res.v4 || {};
  const fs = v4.free_sources || [];
  const ps = v4.paid_sources || [];
  const totalBid = v4.total_bid != null ? v4.total_bid : res.smartCost;
  const naiveT = v4.naive_total != null ? v4.naive_total : res.naiveCost;
  const savePct = v4.savings_vs_naive != null ? v4.savings_vs_naive : res.savingsPct;
  if (!fs.length && !ps.length && !v4.sub_query_runs) return '';
  let synRows = '';
  fs.forEach(s => {
    synRows += `<div class="rp-syn-row"><span>${escapeHtml(s.source || s.title || '—')}</span><span class="rp-syn-tag">FREE</span></div>`;
  });
  ps.forEach(s => {
    const b = s.bid != null ? fmt$(s.bid) : '—';
    synRows += `<div class="rp-syn-row"><span>${escapeHtml(s.source || s.title || '—')}</span><span>${b}</span></div>`;
  });
  if (!synRows) synRows = '<div style="font-size:10px;color:var(--text-muted);padding:4px 0">No line items (empty plan)</div>';
  const synHtml = `<div class="rp-hdr">Synthesis preview</div><div class="rp-syn">${synRows}<div class="rp-syn-sum">Total bid <b>${fmt$(totalBid)}</b> · vs naive ${fmt$(naiveT)} · <b>${(savePct != null ? Number(savePct).toFixed(1) : '0')}%</b> saved</div></div>`;
  return `<div class="rp-pipeline-block">${synHtml}</div>`;
}

function buildSynthesizePanelHtml(res) {
  const syn = (res.v4 || {}).synthesis || {};
  const mode = syn.mode != null ? String(syn.mode) : '—';
  const text = syn.text != null ? String(syn.text) : '';
  const line = syn.summary_line != null ? String(syn.summary_line) : '';
  const renderedMd = text.trim() && typeof marked !== 'undefined'
    ? marked.parse(text, { breaks: false, gfm: true })
    : escapeHtml(text).replace(/\n/g, '<br>');
  const body = text.trim()
    ? `<div class="answer-panel-body answer-prose">${renderedMd}</div>`
    : `<div class="fanout-nores" style="padding:8px 0">No synthesized answer — configure an LLM API key on the server to enable the writer step.</div>`;
  return `
  <div class="fade-in">
    <div class="fanout-title" style="margin-bottom:10px">Answer <span class="fanout-badge">${escapeHtml(mode)}</span></div>
    ${line ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:12px;line-height:1.5">${escapeHtml(line)}</div>` : ''}
    ${body}
  </div>`;
}

const MIN_OPTIMIZE_DISPLAY_DELAY_MS = 1200;

function showOptimizeLoading(){
  renderPipelineLoading();
  startOptimizeClientLog();
  document.getElementById('detailP').innerHTML = `
    <div class="optimize-loading">
      <div class="ol-spinner"></div>
      <div class="ol-text">Running pipeline…</div>
      <div style="font-size:9px;opacity:.6">decomp · signals · search · price fetch · plan · answer</div>
    </div>`;
}

const OPTIMIZE_FETCH_TIMEOUT_MS = 120000;

function showOptimizeFailed(message, hintKind){
  stopOptimizeProgress(false);
  stopOptimizeClientLog();
  appendPipelineLogLine(null, 'Failed: ' + (message || '').trim());
  const m = (message || '').trim();
  let hint = '';
  if (hintKind === 'network' || /^failed to fetch$/i.test(m) || /load failed|networkerror/i.test(m)) {
    hint = 'The browser could not reach the app. Start the server (e.g. <code style="font-size:9px">python app.py</code> or gunicorn), open this page from that origin (not <code style="font-size:9px">file://</code>), and use the same host/port as the API.';
  } else if (hintKind === 'timeout') {
    hint = 'First run can be slow while the embedding model downloads. Set <code style="font-size:9px">BOOTK_DISABLE_RAG=1</code> in <code style="font-size:9px">.env</code> for snippet-only scoring until the model is cached, then retry.';
  } else {
    hint = 'If Optimize hangs on first run, the embedding model may be downloading. Set <code style="font-size:9px">BOOTK_DISABLE_RAG=1</code> in <code style="font-size:9px">.env</code> to use snippet-only scoring until the model is cached.';
  }
  document.getElementById('detailP').innerHTML = `
    <div class="empty" style="padding:20px 16px">
      <div class="empty-icon" style="opacity:.45">⚠</div>
      <div style="max-width:380px;line-height:1.55;font-size:12px;color:var(--text-dim)">${escapeHtml(message)}</div>
      <div style="font-size:10px;color:var(--text-muted);margin-top:14px;line-height:1.45">${hint}</div>
    </div>`;
}

function switchRightTab(tab){

async function go(){
  const q = document.getElementById('qi').value.trim();
  if(!q){ document.getElementById('qi').focus(); return; }
  const btn = document.getElementById('runBtn');
  btn.textContent = '⟳ Analyzing…';
  btn.classList.add('loading');
  btn.disabled = true;
  showOptimizeLoading();
  const startedAt = Date.now();
  const ac = new AbortController();
  const abortTimer = setTimeout(() => ac.abort(), OPTIMIZE_FETCH_TIMEOUT_MS);
  try {
    const resp = await fetch('/optimize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query: q}),
      signal: ac.signal
    });
    clearTimeout(abortTimer);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    // Read SSE stream — server sends ": keepalive" comments every 5s to prevent
    // proxy timeouts, then a single "data: {...}" line with the full result.
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let res = null;
    let keepaliveCount = 0;
    const sseStart = Date.now();
    console.log('[SSE] stream opened, status', resp.status);
    appendPipelineLogLine(null, 'SSE stream opened');
    outer: while (true) {
      const { done, value } = await reader.read();
      const elapsed = ((Date.now() - sseStart) / 1000).toFixed(1);
      if (done) {
        console.warn(`[SSE] stream closed at ${elapsed}s — keepalives received: ${keepaliveCount}, res: ${res ? 'set' : 'null'}`);
        appendPipelineLogLine(null, `SSE stream closed at ${elapsed}s (keepalives: ${keepaliveCount})`);
        break;
      }
      const chunk = decoder.decode(value, { stream: true });
      buf += chunk;
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith(': ')) {
          keepaliveCount++;
          console.log(`[SSE] keepalive #${keepaliveCount} at ${elapsed}s`);
          appendPipelineLogLine(null, `keepalive #${keepaliveCount} (${elapsed}s elapsed)`);
        } else if (line.startsWith('data: ')) {
          console.log(`[SSE] data line at ${elapsed}s, length=${line.length}`);
          appendPipelineLogLine(null, `data received at ${elapsed}s`);
          try {
            res = JSON.parse(line.slice(6));
          } catch(e) {
            console.error('[SSE] JSON parse error:', e, 'raw:', line.slice(6, 200));
            appendPipelineLogLine(null, `JSON parse error: ${e}`);
          }
          break outer;
        } else if (line.trim()) {
          console.log(`[SSE] unknown line at ${elapsed}s:`, JSON.stringify(line.slice(0, 80)));
        }
      }
    }
    if (!res) throw new Error('Empty response from server');
    if (res.ok === false && res.error) throw new Error(String(res.error));
    stopOptimizeProgress(true);
    const elapsed = Date.now() - startedAt;
    const wait = Math.max(0, MIN_OPTIMIZE_DISPLAY_DELAY_MS - elapsed);
    await new Promise(r => setTimeout(r, wait));
    renderDetail(res);
    renderPipelineViz(res);
    totalRuns++;
    sumSavings += (res.savingsPct != null ? res.savingsPct : 0);
    document.getElementById('totalRuns').textContent = totalRuns;
    document.getElementById('avgSavings').textContent = Math.round(sumSavings/totalRuns)+'%';
  } catch(err) {
    console.error(err);
    clearTimeout(abortTimer);
    const isAbort = err && err.name === 'AbortError';
    const raw = (err && err.message) ? String(err.message) : 'Optimize failed.';
    let msg = isAbort
      ? 'Request timed out after ' + (OPTIMIZE_FETCH_TIMEOUT_MS / 1000) + 's. The server may still be working (RAG fetches + embeddings). Try again, or set BOOTK_DISABLE_RAG=1 while the embedding model downloads.'
      : raw;
    const hintKind = isAbort ? 'timeout' : (/failed to fetch/i.test(raw) ? 'network' : 'generic');
    showOptimizeFailed(msg, hintKind);
  }
  finally {
    btn.textContent = '▶ Optimize';
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function initResize(){
  document.querySelectorAll('.resize-handle').forEach(h=>{
    h.addEventListener('mousedown', function(e){
      e.preventDefault();
      const leftId = this.dataset.left, rightId = this.dataset.right;
      const left = document.getElementById(leftId), right = document.getElementById(rightId);
      if(!left || !right) return;
      this.classList.add('dragging');
      let startX = e.clientX, startW1 = left.offsetWidth, startW2 = right.offsetWidth;
      function move(e2){
        const dx = e2.clientX - startX;
        const w1 = Math.max(160, Math.min(600, startW1 + dx));
        left.style.width = w1 + 'px';
        if (right.classList.contains('panel-right')) {
          const w2 = Math.max(180, Math.min(600, startW2 - dx));
          right.style.width = w2 + 'px';
        } else {
          /* Detail column flexes to fill the rest — do not set a fixed width (old 3rd-column gap). */
          right.style.removeProperty('width');
        }
      }
      function stop(){
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', stop);
        document.querySelector('.resize-handle.dragging')?.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', stop);
    });
  });
}

let exaFetchedTotal = 0;

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.exa-fetch-btn');
  if (btn && !btn.disabled) fetchExa(btn, btn.dataset.query, btn.dataset.target);
});

async function fetchExa(btn, query, targetId) {
  const target = document.getElementById(targetId);
  if (!target) return;

  if (btn) { btn.disabled = true; btn.style.opacity = '0.5'; btn.style.cursor = 'default'; }
  target.innerHTML = '<div class="fanout-nores" style="opacity:.7">Fetching paid source…</div>';

  try {
    const resp = await fetch('/fetch-exa', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({query})
    });
    const data = await resp.json();
    if (data.error) {
      if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
      target.innerHTML = `<div class="fanout-nores" style="color:var(--red)">Fetch error: ${escapeHtml(data.error)}</div>`;
      return;
    }
    const results = data.results || [];
    if (!results.length) {
      if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
      target.innerHTML = '<div class="fanout-nores">Paid fetch returned no results for this query.</div>';
      return;
    }

    // Capture attrs before btn is replaced
    const sqIndex = btn ? btn.dataset.sqIndex : null;
    const baseCov = btn ? parseFloat(btn.dataset.baseCov || 0) : 0;
    const floor = btn ? parseFloat(btn.dataset.floor || 0) : 0;
    const cost = data.cost_usd ?? 0.007;

    // Replace button with checkmark
    if (btn) {
      const actionEl = document.getElementById(`gap-action-${sqIndex}`);
      if (actionEl) actionEl.innerHTML = `<span style="display:inline-flex;align-items:center;gap:5px;color:var(--green);font-size:11px;font-weight:600">✓ Fetched paid source</span><span style="font-size:10px;opacity:.6">${fmt$(cost)} charged</span>`;
      else btn.outerHTML = `<span style="color:var(--green);font-size:11px;font-weight:600">✓ Fetched ${fmt$(cost)}</span>`;
    }

    // Update subtotal + savings line
    exaFetchedTotal += cost;
    const display = document.getElementById('exaCostDisplay');
    const sub = document.getElementById('exaCostSub');
    const savingsLine = document.getElementById('exaSavingsLine');
    if (display) {
      display.textContent = fmt$(exaFetchedTotal);
      const allPaid = parseFloat(display.dataset.allPaid || 0);
      const nRuns = parseInt(display.dataset.nRuns || 0);
      const saved = allPaid - exaFetchedTotal;
      if (sub) sub.textContent = `${fmt$(exaFetchedTotal)} charged · ${Math.round(exaFetchedTotal / 0.007)} fetch${exaFetchedTotal > 0.007 ? 'es' : ''} executed`;
      if (savingsLine && saved > 0) savingsLine.textContent = `saved ${fmt$(saved)} vs fetching all ${nRuns} sub-queries at paid rate`;
    }

    // Update gap status chip
    if (sqIndex) {
      // Actual best coverage from paid results; fall back to +15pp estimate
      const bestPaidCov = results.length
        ? Math.max(...results.map(r => parseFloat(r.coverage_score || 0)))
        : 0;
      const actualNewCov = Math.min(Math.max(bestPaidCov, baseCov), 1.0);
      const gained = Math.round((actualNewCov - baseCov) * 100);
      const floorPct = Math.round(floor * 100);
      const basePct = Math.round(baseCov * 100);
      const newPct = Math.round(actualNewCov * 100);
      const gapClosed = actualNewCov >= floor;

      const statusEl = document.getElementById(`gap-status-${sqIndex}`);
      if (statusEl) {
        if (gapClosed) {
          statusEl.textContent = 'CLOSED';
          statusEl.style.background = 'rgba(57,211,83,.12)';
          statusEl.style.color = 'var(--green)';
          statusEl.style.borderColor = 'rgba(57,211,83,.3)';
        } else {
          statusEl.textContent = gained > 0 ? `IMPROVED +${gained}pp` : 'IMPROVED';
          statusEl.style.background = 'rgba(227,179,65,.12)';
          statusEl.style.color = '#e3b341';
          statusEl.style.borderColor = 'rgba(227,179,65,.3)';
        }
      }

      const covLineEl = document.getElementById(`gap-cov-line-${sqIndex}`);
      if (covLineEl) {
        const gainColor = gapClosed ? 'var(--green)' : '#e3b341';
        const gainLabel = gained > 0 ? `+${gained}pp` : '—';
        covLineEl.innerHTML = `Coverage <b style="color:var(--text-dim)">${basePct}%</b> → <b style="color:${gainColor}">${newPct}%</b> · floor <b style="color:var(--text-dim)">${floorPct}%</b> · fetched <b style="color:${gainColor}">${gainLabel}</b>`;
      }
    }

    // Build collapsible results block
    const resultsInner = results.map(r => `
      <div class="fanout-res">
        <a class="fanout-res-title" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">${escapeHtml(r.title || '(No title)')}</a>
        <div class="fanout-res-meta">${escapeHtml(r.source || '—')}${r.date ? ' · ' + escapeHtml(String(r.date).slice(0,10)) : ''}</div>
        ${r.snippet ? `<div class="fanout-res-snippet">${escapeHtml(r.snippet)}</div>` : ''}
      </div>`).join('');

    const resultsHtml = `
      <details open style="margin-top:6px">
        <summary style="cursor:pointer;font-size:10px;color:var(--text-muted);list-style:none;display:flex;align-items:center;gap:6px;padding:4px 0">
          <span style="color:var(--green)">▼</span> ${results.length} paid result${results.length !== 1 ? 's' : ''} · ${fmt$(cost)} charged
        </summary>
        <div style="margin-top:6px">${resultsInner}</div>
      </details>`;

    // Update Plan & buy inline results
    target.innerHTML = resultsHtml;

    // Mirror results into Price fetch probe panel
    if (sqIndex) {
      const probeBody = document.getElementById(`probe-exa-body-${sqIndex}`);
      if (probeBody) probeBody.innerHTML = `<div class="fanout-subhdr">Paid results — ${results.length} fetched · ${fmt$(cost)}</div>` + resultsInner;
    }

    // Re-run synthesis with paid results merged in
    if (lastOptimizeRes) {
      const answerPanel = document.getElementById('mtpAnswer');
      if (answerPanel) {
        answerPanel.innerHTML += `<div style="font-size:10px;color:var(--text-muted);padding:8px 0;opacity:.7">Re-synthesizing with paid sources…</div>`;
      }
      try {
        const synResp = await fetch('/re-synthesize', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            original_query: lastOptimizeRes.query || '',
            sub_query_runs: (lastOptimizeRes.v4 || {}).sub_query_runs || [],
          })
        });
        const synData = await synResp.json();
        if (synData.synthesis && answerPanel) {
          // Store updated synthesis back so subsequent fetches build on it
          if (lastOptimizeRes.v4) lastOptimizeRes.v4.synthesis = synData.synthesis;
          answerPanel.innerHTML = buildSynthesizePanelHtml({
            ...lastOptimizeRes,
            v4: { ...(lastOptimizeRes.v4 || {}), synthesis: synData.synthesis }
          });
        }
      } catch(e) {
        console.warn('re-synthesize failed:', e);
      }
    }
  } catch(e) {
    if (btn) { btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = ''; }
    target.innerHTML = `<div class="fanout-nores" style="color:var(--red)">Request failed: ${escapeHtml(String(e))}</div>`;
  }
}

function openRagOverlay(r) {
  const status = r.rag_status || 'unknown';
  const isOk = status === 'ok';
  const words = r.rag_words_fetched;
  const chunks = r.rag_chunks_count;
  const fetchErr = r.rag_fetch_error;
  const ragPct = r.rag_score != null ? (r.rag_score * 100).toFixed(1) + '%' : '—';
  const snipPct = r.snippet_score != null ? (r.snippet_score * 100).toFixed(1) + '%' : '—';
  const covPct = r.coverage_score != null ? (r.coverage_score * 100).toFixed(1) + '%' : '—';

  const reasonMap = {
    'ok': 'Full page fetched and embedded — RAG score reflects semantic similarity across page chunks.',
    'skip_paywall': 'This domain is on the soft-paywall skip list. The page was not fetched; scoring uses the search title and snippet only.',
    'fetch_short': `Page was fetched but contained fewer than 200 words${words != null ? ' (' + words + ' words scraped)' : ''} — too short for reliable RAG chunking. Snippet score used.`,
    'no_chunks': 'Page text was fetched but produced no usable chunks after splitting. Snippet score used.',
    'embed_failed': 'Chunks were created but embedding failed (model error). Snippet score used.',
    'not_fetched': 'Page was queued for fetch but did not complete before the pipeline deadline. Snippet score used.',
    'no_url': 'No URL on this result — cannot fetch.',
  };
  let reasonText = reasonMap[status] || (status.startsWith('fetch_failed')
    ? `HTTP fetch failed${fetchErr ? ': ' + fetchErr : ''}. Snippet score used.`
    : 'Status: ' + status);

  const rows = [
    ['RAG status', status],
    ['Words scraped', words != null ? words.toLocaleString() : '—'],
    ['Chunks embedded', chunks != null ? String(chunks) : (isOk ? '—' : 'n/a')],
    ['RAG score', ragPct],
    ['Snippet score', snipPct],
    ['Coverage score (used)', covPct + (!isOk ? ' ← snippet fallback' : '')],
  ].map(([k, v]) =>
    `<div class="rag-overlay-row"><span class="rag-overlay-k">${k}</span><span class="rag-overlay-v">${escapeHtml(String(v))}</span></div>`
  ).join('');

  const snippetBlock = (r.title || r.snippet)
    ? `<div style="margin-top:4px">
        <div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Content used for snippet score</div>
        ${r.title ? `<div style="font-size:11px;font-weight:600;color:var(--text);margin-bottom:3px">${escapeHtml(r.title)}</div>` : ''}
        ${r.source ? `<div style="font-size:10px;color:var(--text-muted);margin-bottom:5px">${escapeHtml(r.source)}${r.date ? ' · ' + escapeHtml(r.date) : ''}</div>` : ''}
        ${r.snippet ? `<div style="font-size:10px;color:var(--text-dim);line-height:1.55;border-left:2px solid var(--border2);padding-left:8px">${escapeHtml(r.snippet)}</div>` : ''}
      </div>`
    : '';

  document.getElementById('ragOverlayBody').innerHTML =
    `<div>${rows}</div>` +
    `<div class="rag-overlay-reason${isOk ? ' ok' : ''}">${escapeHtml(reasonText)}</div>` +
    snippetBlock;

  document.getElementById('ragOverlay').classList.add('on');
  document.getElementById('ragOverlayBackdrop').classList.add('on');
}

function closeRagOverlay() {
  document.getElementById('ragOverlay').classList.remove('on');
  document.getElementById('ragOverlayBackdrop').classList.remove('on');
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeRagOverlay();
});
</script>
<div class="rag-overlay-backdrop" id="ragOverlayBackdrop" onclick="closeRagOverlay()"></div>

  <div class="rag-overlay-head">
    <span class="rag-overlay-title" id="ragOverlayTitle">RAG fetch details</span>
    <button class="rag-overlay-close" onclick="closeRagOverlay()" aria-label="Close">×</button>
  </div>
  <div class="rag-overlay-body" id="ragOverlayBody"></div>
</div>
