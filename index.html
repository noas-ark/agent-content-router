<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bootk.ai</title>
<link rel="icon" href="/static/bootk-favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c10; --surface:#0d1117; --surface2:#161b22; --surface3:#1c2333;
    --border:#21262d; --border2:#30363d;
    /* Brighter primary + secondary text for dark UI readability */
    --text:#f7f8fa; --text-dim:#c9d1d9; --text-muted:#8b949e;
    --green:#3fb950; --green-dim:#196c2e;
    --red:#f85149; --yellow:#d29922; --blue:#388bfd; --purple:#bc8cff;
    --accent:#39d353; --accent-dim:rgba(57,211,83,.08);
    --d-relevance:#388bfd;
    --d-credibility:#d29922;
    --d-freshness:#f85149;
    --d-depth:#bc8cff;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Mono',monospace;background:var(--bg);color:var(--text);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* TOP BAR */
  .topbar{height:44px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;letter-spacing:.04em}
  .logo-icon{display:flex;align-items:center;flex-shrink:0}
  .logo-icon img{height:20px;width:auto;display:block;vertical-align:middle}
  .logo .logo-text{color:var(--text)}
  .sep{width:1px;height:18px;background:var(--border2)}
  .badge{font-size:10px;padding:2px 7px;background:rgba(57,211,83,.1);color:var(--accent);border-radius:20px;border:1px solid rgba(57,211,83,.2)}
  .tbar-stat{font-size:10px;color:var(--text-dim);display:flex;align-items:center;gap:5px}
  .tbar-stat span{color:var(--accent);font-weight:500}
  .ml-auto{margin-left:auto}
  .pulse-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
  .topbar a.admin-link{font-size:10px;color:var(--text-muted);text-decoration:none;letter-spacing:.06em;padding:4px 8px;border-radius:4px;transition:color .15s,background .15s}
  .topbar a.admin-link:hover{color:var(--text-dim);background:var(--surface2)}
  .topbar a.api-ref-pill{text-decoration:none;transition:opacity .15s,transform .15s}
  .topbar a.api-ref-pill:hover{opacity:.9;transform:scale(1.02)}
  .query-breakdown{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:16px}
  .query-breakdown .qb-title{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .query-breakdown .qb-title span:last-child{font-size:8px;font-weight:normal;color:var(--text-muted);opacity:.9}
  .query-breakdown .qb-row{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;font-size:11px}
  .query-breakdown .qb-row:last-child{margin-bottom:0}
  .query-breakdown .qb-k{color:var(--text-muted);min-width:120px;flex-shrink:0}
  .query-breakdown .qb-v{color:var(--text);word-break:break-word}
  .query-breakdown .qb-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .query-breakdown .qb-chip{font-size:9px;padding:2px 6px;background:var(--surface3);border:1px solid var(--border2);border-radius:3px;color:var(--text-dim)}
  .query-breakdown .qb-chip.trending{color:var(--yellow);border-color:rgba(210,153,34,.3);background:rgba(210,153,34,.08)}
  .query-breakdown .qb-intent-list{color:var(--text-dim);font-size:11px;line-height:1.5}

  /* Decomposed sub-queries (query fanout) */
  .fanout-block{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px 14px;margin-bottom:16px}
  .fanout-block .fanout-title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fanout-title-tip{cursor:help;border-bottom:1px dotted rgba(139,148,158,.55)}
  .fanout-block .fanout-badge{font-size:9px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:10px;background:var(--surface3);border:1px solid var(--border2);color:var(--text-dim)}
  .fanout-item{border:1px solid var(--border);border-radius:5px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
  .fanout-item:last-child{margin-bottom:0}
  .fanout-item-hd{display:flex;align-items:flex-start;gap:10px}
  .fanout-idx{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent)}
  .fanout-q{font-size:12px;font-weight:600;color:var(--text);line-height:1.4;margin:0;word-break:break-word}
  .fanout-goal{font-size:11px;color:var(--text-dim);line-height:1.45;margin-top:6px}
  .fanout-goal-lbl{color:var(--text-muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
  .fanout-goal-full{cursor:help;border-bottom:1px dotted rgba(139,148,158,.4)}
  .fanout-goal-details{margin-top:8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);overflow:hidden}
  .fanout-goal-details > summary{cursor:pointer;list-style:none;padding:7px 10px;font-size:11px;color:var(--text-dim);line-height:1.45;user-select:none}
  .fanout-goal-details > summary::-webkit-details-marker{display:none}
  .fanout-goal-details > summary::before{content:'▸';display:inline-block;margin-right:6px;font-size:9px;color:var(--text-muted);transition:transform .12s}
  .fanout-goal-details[open] > summary::before{transform:rotate(90deg)}
  .fanout-goal-details .fanout-goal-sum{font-weight:500;color:var(--text)}
  .fanout-goal-detail{padding:0 10px 10px 28px;font-size:11px;line-height:1.55;color:var(--text-dim);border-top:1px solid var(--border2);margin-top:0;padding-top:8px}
  .signals-simple-qb{margin-top:12px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:11px}
  .signals-simple-qb .ss-row{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--border2)}
  .signals-simple-qb .ss-row:last-child{border-bottom:none}
  .signals-simple-qb .ss-k{flex:0 0 120px;color:var(--text-muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em}
  .signals-simple-qb .ss-v{flex:1;color:var(--text-dim);word-break:break-word}
  .signals-panel-simple .dr-critic-block{margin-top:16px}
  .fanout-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  .fanout-chip{font-size:9px;padding:3px 7px;background:var(--surface3);border:1px solid var(--border2);border-radius:3px;color:var(--text-dim)}
  .fanout-subhdr{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:12px 0 6px}
  .fanout-res-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--border);padding:10px 0}
  .fanout-res-row:first-of-type{border-top:none;padding-top:2px}
  .fanout-res-row-paywall{border-left:3px solid rgba(210,153,34,.55);padding-left:10px;margin-left:-2px;border-radius:2px 0 0 2px;background:rgba(210,153,34,.04)}
  .fanout-res-row-snippet-only{opacity:.92}
  .fanout-res-paywall-badge{font-size:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:rgba(210,153,34,.14);color:#d29922;border:1px solid rgba(210,153,34,.4);flex-shrink:0;line-height:1.2}
  .fanout-res-paywall-note{font-size:9px;color:var(--text-muted);margin-top:5px;line-height:1.35}
  .fanout-res-main{flex:1;min-width:0}
  .rag-rel-box{
    flex-shrink:0;width:108px;text-align:right;padding:9px 11px;border-radius:8px;
    border:1px solid rgba(63,185,80,.4);background:rgba(63,185,80,.1);cursor:help;
    box-shadow:0 0 0 1px rgba(63,185,80,.06) inset;
  }
  .rag-rel-box:hover{border-color:var(--accent);background:var(--accent-dim);box-shadow:0 0 12px rgba(57,211,83,.12)}
  .rag-rel-lbl{font-size:8px;color:var(--text-muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
  .rag-rel-num{font-size:24px;font-weight:700;color:var(--green);line-height:1;font-family:'IBM Plex Mono',monospace;letter-spacing:-0.03em}
  .rag-rel-bar{height:6px;background:var(--surface3);border-radius:4px;margin-top:8px;overflow:hidden}
  .rag-rel-bar > div{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:4px;transition:width .4s ease}
  .rag-rel-sub{font-size:8px;color:var(--text-muted);margin-top:5px;line-height:1.3}
  .fanout-res{border-top:1px solid var(--border);padding:8px 0}
  .fanout-res:first-of-type{border-top:none;padding-top:2px}
  .fanout-res-title{font-size:11px;font-weight:500;color:#58a6ff;text-decoration:none;display:block;line-height:1.35}
  .fanout-res-title:hover{text-decoration:underline}
  .fanout-res-meta{font-size:9px;color:var(--text-muted);margin-top:3px}
  .fanout-res-snippet{font-size:10px;color:var(--text-dim);margin-top:5px;line-height:1.45}
  .fanout-nores{font-size:10px;color:var(--text-muted);padding:4px 0 8px}
  .fanout-status-gap{color:var(--yellow)!important;border-color:rgba(210,153,34,.35)!important;background:rgba(210,153,34,.08)!important}
  .fanout-status-ok{color:var(--green)!important;border-color:rgba(63,185,80,.35)!important;background:rgba(63,185,80,.08)!important}

  /* LAYOUT — two columns: fixed query rail + detail fills remaining width (no empty 3rd column) */
  .main{flex:1;display:flex;overflow:hidden;position:relative;width:100%;min-width:0}
  .panel{flex:0 0 auto;width:var(--col-width, 280px);min-width:160px;max-width:600px;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
  .panel.panel-detail{flex:1 1 0%;min-width:260px;width:auto;max-width:none;border-right:none}
  .resize-handle{width:6px;flex-shrink:0;cursor:col-resize;background:transparent;transition:background .15s}
  .resize-handle:hover,.resize-handle.dragging{background:var(--accent-dim)}
  .ph{height:34px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:7px;font-size:11px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;flex-shrink:0}
  .ph-dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted)}
  .ph-dot.on{background:var(--accent);box-shadow:0 0 5px var(--accent)}
  .pb{flex:1;overflow-y:auto;padding:14px}
  ::-webkit-scrollbar{width:3px}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

  /* INPUTS */
  .lbl{font-size:10px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:13px}
  .lbl:first-child{margin-top:0}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.65;padding:14px;resize:vertical;outline:none;transition:border-color .15s;min-height:160px}
  textarea:focus{border-color:var(--accent)}
  textarea::placeholder{color:var(--text-muted)}
  .run-row{display:flex;align-items:stretch;gap:10px;margin-top:13px}
  .run-btn{flex:1;min-width:0;margin-top:0;padding:10px;background:var(--accent);color:#000;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.08em;border:none;border-radius:5px;cursor:pointer;transition:all .15s;text-transform:uppercase}
  .run-btn:hover{background:#58e86a;transform:translateY(-1px)}
  .run-btn.loading{background:var(--surface3);color:var(--text-muted);cursor:not-allowed;transform:none}
  .examples-inline{flex-shrink:0;display:flex;flex-direction:column;align-items:stretch;justify-content:stretch;width:112px;min-width:108px}
  .examples-toggle{width:100%;height:100%;min-height:40px;padding:8px 6px;margin:0;background:var(--surface2);border:1px solid var(--border2);border-radius:5px;color:var(--text-dim);font-size:10px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;font-family:'IBM Plex Mono',monospace;transition:color .15s,border-color .15s,background .15s;display:flex;align-items:center;justify-content:center;gap:5px}
  .examples-toggle:hover{color:var(--text);border-color:var(--accent);background:var(--accent-dim)}
  .examples-toggle.open{color:var(--accent);border-color:rgba(57,211,83,.35)}
  .chips-wrap{margin-top:8px}
  .divider{height:1px;background:var(--border);margin:12px 0}
  .sc-chip{padding:7px 9px;background:var(--surface2);border:1px solid var(--border2);border-radius:4px;font-size:10px;color:var(--text-dim);cursor:pointer;transition:all .15s;line-height:1.4;margin-bottom:5px}
  .sc-chip:hover{border-color:var(--accent);color:var(--text);background:var(--accent-dim)}
  .sc-tag{font-size:8px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
  .toggle-btn .caret{font-size:8px;transition:transform .2s ease;display:inline-block}
  .examples-toggle:not(.open) .caret{transform:rotate(-90deg)}
  .examples-toggle.open .caret{transform:rotate(0deg)}

  /* SIGNAL ROWS */
  .dim-section{margin-bottom:20px}
  .dim-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 10px;background:var(--surface2);border-radius:4px;border:1px solid var(--border)}
  .dim-tag{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px}
  .dim-composed{margin-left:auto;font-size:11px;font-weight:600}
  .dim-desc{font-size:9px;color:var(--text-muted)}

  .sig-row{display:grid;grid-template-columns:1fr 120px 52px;align-items:center;gap:8px;margin-bottom:8px;padding:5px 0;border-bottom:1px solid var(--border)}
  .sig-row:last-child{border-bottom:none}
  .sig-name{font-size:11px;color:var(--text);font-weight:500}
  .sig-source{font-size:8px;color:var(--text-muted);margin-top:1px}
  .bar-wrap{height:5px;background:var(--surface3);border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width .7s cubic-bezier(.4,0,.2,1)}

  /* HOVERABLE VALUE */
  .sig-val-wrap{position:relative;display:inline-block}
  .sig-val{
    font-size:12px;font-weight:600;cursor:help;
    padding:2px 7px;border-radius:3px;
    border:1px solid transparent;
    transition:all .15s;
    display:inline-block;
    white-space:nowrap;
  }
  .sig-val:hover{border-color:var(--border2);background:var(--surface3)}

  /* TOOLTIP */
  .tooltip{
    position:fixed;
    z-index:1000;
    width:300px;
    max-width:min(300px, 92vw);
    background:#0d1117;
    border:1px solid var(--border2);
    border-radius:6px;
    padding:10px 12px;
    font-size:11px;
    line-height:1.65;
    color:var(--text-dim);
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
    box-shadow:0 8px 24px rgba(0,0,0,.6);
  }
  .tooltip.show{opacity:1}
  .tooltip b{color:var(--text);display:block;margin-bottom:4px;font-size:11px}
  .tooltip .t-calc{
    margin-top:6px;padding-top:6px;
    border-top:1px solid var(--border);
    font-size:10px;color:var(--text-muted);
    font-family:'IBM Plex Sans',sans-serif;
  }
  .tooltip .t-val{color:var(--accent);font-weight:600}

  /* FLAG BADGE */
  .sig-flag{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:600;letter-spacing:.05em;white-space:nowrap}

  /* COMPOSED SCORES */
  .composed-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:16px}
  .composed-card{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:10px}
  .cc-label{font-size:9px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .cc-val{font-size:22px;font-weight:600;line-height:1}

  /* SOURCE CARDS */
  .src-card{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:9px 11px;margin-bottom:7px;display:grid;grid-template-columns:1fr 70px 80px;align-items:center;gap:8px;opacity:0;transform:translateX(-8px);transition:all .3s}
  .src-card.vis{opacity:1;transform:translateX(0)}
  .src-card.sel{border-color:var(--accent);background:var(--accent-dim)}
  .src-card.rej{opacity:.28}
  .src-n{font-size:12px;font-weight:500}
  .src-m{font-size:9px;color:var(--text-muted);margin-top:1px}
  .src-bar{height:3px;background:var(--surface3);border-radius:2px;margin-top:5px;overflow:hidden}
  .src-bf{height:100%;border-radius:2px}

  /* HOVERABLE PRICE */
  .src-price-wrap{position:relative;text-align:right}
  .src-price{
    font-size:11px;font-weight:600;cursor:help;
    padding:2px 6px;border-radius:3px;
    border:1px solid transparent;
    transition:all .15s;
    display:inline-block;
  }
  .src-price:hover{border-color:var(--border2);background:var(--surface3)}
  .src-status{font-size:8px;letter-spacing:.06em;text-transform:uppercase;text-align:right;margin-top:2px}

  /* UTILITY MINI BARS */
  .src-util{text-align:center}
  .src-util-val{font-size:12px;font-weight:600}
  .src-util-lbl{font-size:8px;color:var(--text-muted);margin-top:1px}

  /* RIGHT PANEL */
  .metric-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
  .mc{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:10px 12px}
  .mc-lbl{font-size:10px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
  .mc-val{font-size:20px;font-weight:600;line-height:1.1}
  .mc-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
  .savings-wrap{background:var(--surface3);height:6px;border-radius:4px;overflow:hidden;margin:7px 0}
  .savings-fill{height:100%;background:linear-gradient(90deg,var(--green-dim),var(--green));border-radius:4px;width:0%;transition:width .9s cubic-bezier(.4,0,.2,1) .2s}
  .pi{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--accent-dim);border:1px solid rgba(57,211,83,.2);border-radius:4px;margin-bottom:6px;opacity:0;transform:translateY(5px);transition:all .3s}
  .pi.vis{opacity:1;transform:translateY(0)}
  .pi-name{flex:1;font-size:12px}
  .pi-util{font-size:9px;color:var(--text-muted);background:var(--surface3);padding:2px 5px;border-radius:3px}
  .pi-price{font-size:12px;font-weight:600;color:var(--accent)}
  .roi-card{background:var(--surface2);border:1px solid var(--border2);border-radius:5px;padding:12px;margin-top:7px}
  .roi-hdr{font-size:9px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
  .roi-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px}
  .roi-row:last-child{border-bottom:none}
  .roi-row .rl{color:var(--text-dim)}
  .roi-row .rv{color:var(--text);font-weight:500}
  .roi-row .rv.hi{color:var(--accent);font-size:13px}

  .intent-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .st{font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:7px}
  .st::after{content:'';flex:1;height:1px;background:var(--border)}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text-dim);font-size:11px;text-align:center;padding:20px}
  .empty-icon{font-size:28px;opacity:.25;margin-bottom:3px}
  .optimize-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:14px;color:var(--text-dim);font-size:11px;text-align:center;padding:20px}
  .optimize-loading .ol-spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .optimize-loading .ol-text{letter-spacing:.06em;opacity:.9}
  @keyframes spin{to{transform:rotate(360deg)}}

  <div class="pipeline-nav" id="pipelineNav">
    <div class="pipeline-nav-steps" role="tablist" aria-label="Optimize pipeline">
      <button type="button" class="pipe-step active" role="tab" data-main-tab="signals" onclick="switchMainTab('signals')">signals<span class="tab-dot"></span></button>
      <span class="pipe-connector" aria-hidden="true"></span>
      <button type="button" class="pipe-step" role="tab" data-main-tab="subqueries" onclick="switchMainTab('subqueries')">subqueries<span class="tab-dot"></span></button>
      <span class="pipe-connector" aria-hidden="true"></span>
      <button type="button" class="pipe-step" role="tab" data-main-tab="search" onclick="switchMainTab('search')">search<span class="tab-dot"></span></button>
      <span class="pipe-connector" aria-hidden="true"></span>
      <button type="button" class="pipe-step" role="tab" data-main-tab="probe" onclick="switchMainTab('probe')">price fetch<span class="tab-dot"></span></button>
      <span class="pipe-connector" aria-hidden="true"></span>
      <button type="button" class="pipe-step" role="tab" data-main-tab="plan" onclick="switchMainTab('plan')">plan &amp; buy<span class="tab-dot"></span></button>
      <span class="pipe-connector" aria-hidden="true"></span>
      <button type="button" class="pipe-step" role="tab" data-main-tab="answer" onclick="switchMainTab('answer')">answer<span class="tab-dot"></span></button>

      <div class="pld-body" id="pipelineLogBody"><div style="opacity:.6">Run Optimize or switch tabs to append entries.</div></div>
    </aside>
  </div>
  <div class="pb" id="detailP">
    <div class="empty">
      <div class="empty-icon">⬡</div>
      <div>Run Optimize to see<br>signals → subqueries → search → price fetch → plan → answer</div>
    </div>
  </div>
</div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════

const SCENARIOS = [
  {tag:"DeFi Regulation",   q:"What SEC and CFTC enforcement actions targeted DeFi protocols and on-chain derivatives in Q1 2025, and what precedents do they set for token issuers?"},
  {tag:"Private Credit",    q:"Analyze covenant-lite default trends and recovery rates in US middle-market private credit using lender loss data and rating-agency reports from Q1 2025"},
  {tag:"Drug Pricing",      q:"What is the latest net pricing data and rebate trends for GLP-1 drugs in the US from PBM and payer reports, and how does this compare to list price?"},
  {tag:"LNG Spreads",       q:"What are current JKM–TTF–Henry Hub spread dynamics and what do specialist energy trading desks forecast for Q3 2025 LNG arbitrage windows?"},
  {tag:"Semis Supply",      q:"What is the current lead-time and allocation status for advanced packaging capacity at TSMC CoWoS and Samsung 2.5D nodes as of Q1 2025?"},
  {tag:"M&A Antitrust",     q:"Assess likely antitrust outcomes for major US-EU tech M&A cases filed in 2025 using the latest DOJ/FTC statements and legal analysis"},
  {tag:"AI Liability",      q:"What product-liability and IP indemnification terms are frontier AI vendors offering enterprise customers in 2025 contracts, and how do they differ?"},
  {tag:"Defense Supply",    q:"Assess bottlenecks in NATO 155mm artillery shell production capacity using contractor disclosures and specialist defense-industry reporting from 2025"},
];

let totalRuns=0, sumSavings=0;

// ═══════════════════════════════════════════════════════════════
// TOOLTIP ENGINE — registry-based (no HTML in data attributes)
// ═══════════════════════════════════════════════════════════════

const tip = document.getElementById('tooltip');
let tipTimeout;
const TIP_REGISTRY = {};
let tipIdCounter = 0;

function registerTip(html) {
  const id = 'tip_' + (tipIdCounter++);
  TIP_REGISTRY[id] = html;
  return id;
}

/** Hover copy for Query fanout heading + meta chips (registered once). */
let _fanoutPillTips = null;
function getFanoutPillTips() {
  if (_fanoutPillTips) return _fanoutPillTips;
  _fanoutPillTips = {
    queryFanoutHeading: registerTip(
      '<b>Query fanout</b><div class="t-calc"><b>What it is</b> — Your question is split into <b>several distinct web search strings</b> (one facet per sub-query) so each retrieval pass stays focused.<br><br><b>How sub-queries are produced</b> — When an LLM API key is configured, a structured planner returns a deduped list of search tasks capped at the configured maximum. Without a key, lightweight local rules decompose the query (short query → one search; long text → token-window splits).</div>'
    ),
    floor: registerTip(
      '<b>Quality floor</b><div class="t-calc">Minimum relevance this sub-query needs from a <b>free</b> hit, from routing signals (<code>quality_threshold</code>). Compare with results in the <b>search</b> step.</div>'
    ),
    intent: registerTip(
      '<b>Intent</b><div class="t-calc">Coarse <b>task label</b> for routing (e.g. breaking news vs factual lookup), from <code>_infer_signals</code>: structured LLM output when an API key exists, else local keyword rules.</div>'
    ),
    domain: registerTip(
      '<b>Domain</b><div class="t-calc">Broad <b>topic bucket</b> (scientific, financial, legal, …) used with intent for source fit and bid ceilings.</div>'
    ),
    content: registerTip(
      '<b>Content type</b><div class="t-calc">Expected <b>source shape</b> — e.g. <code>news_article</code>, <code>academic_paper</code>, <code>regulatory_doc</code> — from the same routing signals.</div>'
    ),
    ceiling: registerTip(
      '<b>Ceiling</b><div class="t-calc">Maximum <b>bid per article</b> (USD) this sub-query is allowed to spend, derived from intent, domain, and quality needs — the purchase-plan cap.</div>'
    ),
  };
  return _fanoutPillTips;
}

/** Goal line per sub-query — expand to read the full goal (threshold ~1–2 sentences). */
function fmtGoalBlock(raw) {
  const g = (raw || '').trim();
  if (!g) return '';
  const esc = escapeHtml(g);
  const useDetails = g.length > 48 || g.includes('\n');
  if (!useDetails) {
    return `<div class="fanout-goal"><span class="fanout-goal-lbl">Goal · </span>${esc}</div>`;
  }
  const sumSlice = g.slice(0, 80);
  const sumMore = g.length > 80 || g.includes('\n');
  const sumHtml = escapeHtml(sumSlice) + (sumMore ? '…' : '');
  const bodyHtml = esc.replace(/\n/g, '<br>');
  return (
    `<details class="fanout-goal-details">` +
    `<summary><span class="fanout-goal-lbl">Goal</span> <span class="fanout-goal-sum">${sumHtml}</span></summary>` +
    `<div class="fanout-goal-detail">${bodyHtml}</div>` +
    `</details>`
  );
}

/** Short `goal` + expanded `research_objective` (DeepReason-style); falls back to fmtGoalBlock(goal) if no expansion. */
function fmtGoalBlockPair(goal, researchObjective) {
  const g = (goal || '').trim();
  const ro = (researchObjective || '').trim();
  if (!g && !ro) return '';
  if (!ro || ro === g) {
    return g ? fmtGoalBlock(g) : fmtGoalBlock(ro);
  }
  const escG = escapeHtml(g);
  const escRo = escapeHtml(ro).replace(/\n/g, '<br>');
  return (
    `<details class="fanout-goal-details">` +
    `<summary><span class="fanout-goal-lbl">Goal</span> <span class="fanout-goal-sum">${escG}</span></summary>` +
    `<div class="fanout-goal-detail"><span class="fanout-goal-lbl" style="display:block;margin-bottom:6px;opacity:.9">Research objective</span>${escRo}</div>` +
    `</details>`
  );
}

function coverageIsIncomplete(covStr) {
  const m = String(covStr || '').trim().match(/^(\d+)\s*\/\s*(\d+)$/);
  if (!m) return false;
  return m[1] !== m[2];
}

function coverageBadgeTipRegister(covStr) {
  const covInc = coverageIsIncomplete(covStr);
  const id = registerTip(
    '<b>Coverage ' +
      escapeHtml(covStr) +
      '</b><div class="t-calc">' +
      (covInc
        ? '<b>Incomplete</b> — Numerator &lt; denominator: at least one sub-query still needed paid-tier value or did not meet the free quality floor, so <b>a purchase or bid</b> may be part of the optimized plan.<br><br>'
        : '<b>Full coverage</b> — Every sub-query met the bar with free hits (or equivalent).<br><br>') +
      `Counts sub-queries where the best free hit met that sub-query’s quality floor (or a paid hit was used) vs. all sub-queries run.</div>`
  );
  return { tipId: id, warn: covInc };
}

function showTip(el) {
  clearTimeout(tipTimeout);
  const id = el.dataset.tipid;
  if (!id || !TIP_REGISTRY[id]) return;
  tip.innerHTML = TIP_REGISTRY[id];
  tip.classList.add('show');
  positionTip(el);
}

function positionTip(el) {
  const r = el.getBoundingClientRect();
  tip.style.visibility = 'hidden';
  tip.style.display = 'block';
  const tw = tip.offsetWidth || 300;
  const th = tip.offsetHeight || 120;
  tip.style.visibility = '';
  let left = r.right + 10;
  let top  = r.top;
  if (left + tw > window.innerWidth - 10) left = r.left - tw - 10;
  if (top + th > window.innerHeight - 10) top = window.innerHeight - th - 10;
  tip.style.left = left + 'px';
  tip.style.top  = Math.max(8, top) + 'px';
}

function hideTip() {
  tipTimeout = setTimeout(() => tip.classList.remove('show'), 120);
}

// Single delegated listener — no inline handlers needed
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tipid]');
  if (el) { clearTimeout(tipTimeout); showTip(el); }
  else if (!e.target.closest('#tooltip')) hideTip();
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-tipid].bid-clickable');
  if (el) { clearTimeout(tipTimeout); showTip(el); }
});
document.addEventListener('mouseout', e => {
  if (!e.target.closest('[data-tipid]') && !e.target.closest('#tooltip')) hideTip();
});

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════

const INTENT_META = {
  financial_analysis: {label:"Financial Analysis",  color:"#d29922",bg:"rgba(210,153,34,.12)"},
  breaking_news:      {label:"Breaking News",        color:"#f85149",bg:"rgba(248,81,73,.12)"},
  tech_product:       {label:"Tech Coverage",        color:"#388bfd",bg:"rgba(56,139,253,.12)"},
  explainer:          {label:"Research / Explainer", color:"#bc8cff",bg:"rgba(188,140,255,.12)"},
  policy:             {label:"Policy Analysis",      color:"#39d353",bg:"rgba(57,211,83,.12)"},
  medical_clinical:   {label:"Medical / Clinical",   color:"#ff7b72",bg:"rgba(255,123,114,.12)"},
};

const DIM_META = {
  relevance:   {label:"Relevance",   color:"var(--d-relevance)"},
  credibility: {label:"Credibility", color:"var(--d-credibility)"},
  freshness:   {label:"Freshness",   color:"var(--d-freshness)"},
  depth:       {label:"Depth",       color:"var(--d-depth)"},
};

function pct(v){
  const n = Number(v);
  if (v == null || Number.isNaN(n)) return '0%';
  return (n * 100).toFixed(0) + '%';
}

function valColor(v, dimColor){
  return v > .72 ? dimColor : v > .45 ? 'var(--text-dim)' : 'var(--text-muted)';
}

function makeSigVal(v, tipHtml, dimColor, flag){
  const vc = valColor(v, dimColor);
  const pctStr = pct(v);
  const id = registerTip(tipHtml);
  if(flag){
    return `<div style="display:flex;align-items:center;gap:4px">
      <span class="sig-val" style="color:${vc}" data-tipid="${id}">${pctStr}</span>
      <span class="sig-flag" style="background:${flag.bg};color:${flag.color}">${flag.text}</span>
    </div>`;
  }
  return `<span class="sig-val" style="color:${vc}" data-tipid="${id}">${pctStr}</span>`;
}

function sigRow(label, src, sigObj, dimColor, flag){
  const barC = valColor(sigObj.v, dimColor);
  return `
    <div class="sig-row">
      <div>
        <div class="sig-name">${label}</div>
        <div class="sig-source">${src}</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${pct(sigObj.v)};background:${barC}"></div>
      </div>
      ${makeSigVal(sigObj.v, sigObj.tip, dimColor, flag)}
    </div>`;
}

// ═══════════════════════════════════════════════════════════════
// BUILD SIGNAL OBJECTS FROM API RESPONSE
// ═══════════════════════════════════════════════════════════════

function buildSigObjects(sigs) {
  if (!sigs) sigs = {};
  const {intent, intentScores, matchedTemplate, minSources} = sigs;
  const entities = sigs.entities || [];
  const R = sigs.relevance || {};
  const C = sigs.credibility || {};
  const F = sigs.freshness || {};
  const D = sigs.depth || {};

  return {
    relevance: {
      semantic: {v: R.semantic,
        tip: `<b>Semantic Match · ${pct(R.semantic)}</b>Query text compared against 6 intent profile vocabularies using keyword cosine similarity.<div class="t-calc">Top intent: <span class="t-val">${(intent||'').replace(/_/g,' ')}</span> (score: ${intentScores && intentScores[intent] != null ? intentScores[intent].toFixed(3) : '—'})<br>Formula: intersection(query_words, profile_words) / √(|query| × |profile|)<br>Scaled: raw×3.8 + 0.22, capped at 0.98</div>`},
      entityDensity: {v: R.entityDensity,
        tip: `<b>Entity Density · ${pct(R.entityDensity)}</b>Named entities detected in the query.<div class="t-calc">Entities found: <span class="t-val">${entities.length > 0 ? entities.slice(0,5).join(', ') : 'none'}</span><br>Formula: min(entity_count / 7, 1.0)<br>Source: FB paper §3.1 "entity linking" component</div>`},
      specificity: {v: R.specificity,
        tip: `<b>Specificity · ${pct(R.specificity)}</b>How narrow vs. broad the query is. Specific queries justify paying for exact-match content.<div class="t-calc">Markers checked: Q1–Q4, year references, $amounts, %, IPO, CEO, "exactly", "specific"<br>Triggered: <span class="t-val">${R.specificTriggered ? 'yes — scored 0.88' : 'no — scored by length (' + R.wordCount + ' words)'}</span><br>Narrow queries (0.8+) pay for precision; broad queries (0.3–0.5) can use general sources</div>`},
      templateBoost: {v: R.templateBoost,
        tip: `<b>Template Boost · ${pct(R.templateBoost)}</b>Structural pattern matching — does the query match a known high-value template?<div class="t-calc">Matched template: <span class="t-val">${matchedTemplate ? matchedTemplate.label : 'none'}</span><br>Boost applied: <span class="t-val">${matchedTemplate ? '+' + matchedTemplate.boost : '0 (baseline 0.5)'}</span><br>Source: FB paper §3.1 "Intent Template" — e.g. &lt;company&gt;_earnings_&lt;period&gt;</div>`},
      composed: R.composed,
    },
    credibility: {
      stakes: {v: C.stakes,
        tip: `<b>Stakes Level · ${pct(C.stakes)}</b>Is the user making a decision (high) or just seeking information (low)? High stakes = pay for authoritative sources.<div class="t-calc">High-stakes keywords: "should I", "invest", "treatment", "diagnosis", "legal"<br>Triggered: <span class="t-val">${C.stakesLevel === 'high' ? 'YES (0.95)' : C.stakesLevel === 'medium' ? 'medium (0.68)' : 'no (0.38)'}</span><br>Novel signal — not in FB paper or vLLM. Unique to content purchase optimization.</div>`},
      sensitivity: {v: C.sensitivity,
        tip: `<b>Domain Sensitivity · ${pct(C.sensitivity)}</b>Medical, legal, and financial advice queries require certified authoritative sources regardless of cost.<div class="t-calc">Sensitivity keywords: medical, clinical, legal, financial advice, drug, diagnosis, prescription<br>Triggered: <span class="t-val">${C.sensitivityLevel === 'high' ? 'YES — high sensitivity domain (0.92)' : C.sensitivityLevel === 'finance' ? 'finance domain (0.72)' : 'general query (0.30)'}</span><br>Raises quality floor; free sources penalized in this regime.</div>`},
      corroboration: {v: C.corroboration,
        tip: `<b>Corroboration Need · ${pct(C.corroboration)}</b>How many independent sources are needed? High corroboration = buy ≥2 sources from different publishers.<div class="t-calc">Formula: stakes×0.5 + controversy×0.3 + (breaking?0.25:0)<br>Min sources required: <span class="t-val">${minSources}</span><br>High corroboration prevents over-reliance on single biased source.</div>`},
      controversy: {v: C.controversy,
        tip: `<b>Controversy · ${pct(C.controversy)}</b>Does this topic have multiple valid perspectives that a single source might miss or distort?<div class="t-calc">Controversy keywords: policy, debate, ban, restrict, vs., disagree, dispute<br>Triggered: <span class="t-val">${C.controversyTriggered ? 'YES (0.78)' : 'no (0.28)'}</span><br>High controversy → diversify sources to avoid perspective bias.</div>`},
      composed: C.composed,
    },
    freshness: {
      velocity: {v: F.velocity,
        tip: `<b>Velocity / Trending · ${pct(F.velocity)}</b>How time-sensitive is the content? Drives whether we require real-time sources.<div class="t-calc">Real-time keywords: "today", "this morning", "just", "breaking", "right now"<br>Recent keywords: "this week", "latest", "2026", "Q1 2026"<br>Triggered: <span class="t-val">${F.velocityLevel === 'real-time' ? 'REAL-TIME (1.0)' : F.velocityLevel === 'recent' ? 'RECENT (0.74)' : F.velocityLevel === 'archival' ? 'ARCHIVAL (0.12)' : 'neutral (0.38)'}</span><br>Source: FB paper §3.1 "Trending Detection" component</div>`},
      temporalMarkers: {v: F.temporalMarkers,
        tip: `<b>Temporal Markers · ${pct(F.temporalMarkers)}</b>Explicit time references in the query. More markers = tighter freshness window.<div class="t-calc">Markers extracted: <span class="t-val">${(F.timeMarkers && F.timeMarkers.length) ? F.timeMarkers.join(', ') : 'none'}</span><br>Formula: velocity + (marker_count × 0.04)<br>Max freshness age derived: <span class="t-val">${F.maxFreshnessHours >= 9999 ? 'unlimited' : (F.maxFreshnessHours != null ? F.maxFreshnessHours + ' hours' : '—')}</span></div>`},
      eventUrgency: {v: F.eventUrgency,
        tip: `<b>Event Urgency · ${pct(F.eventUrgency)}</b>Specific time-locked events (earnings, rate decisions, IPOs) that have a hard freshness deadline.<div class="t-calc">Event keywords: earnings, IPO, merger, rate decision, profit warning, "down X%"<br>Triggered: <span class="t-val">${F.eventTriggered ? 'YES — event detected (0.82)' : 'no (0.22)'}</span><br>Events require sources published within the event window, not just recently.</div>`},
      decayRate: {v: F.decayRate,
        tip: `<b>Decay Rate · ${pct(F.decayRate)}</b>How fast does this type of content go stale? High decay = content worthless after hours.<div class="t-calc">By intent type:<br>• breaking_news: 1.0 (hourly decay)<br>• financial_analysis: 0.88 (daily)<br>• policy: 0.42 (weekly)<br>• explainer: 0.10 (evergreen)<br>Current intent: <span class="t-val">${intent} → ${F.decayRate}</span></div>`},
      composed: F.composed,
      required: F.required,
      maxFreshnessHours: F.maxFreshnessHours,
      timeMarkers: F.timeMarkers,
    },
    depth: {
      complexity: {v: D.complexity,
        tip: `<b>Query Complexity · ${pct(D.complexity)}</b>Analytical vs. simple factual query. Complex queries need deeper sources, not just headlines.<div class="t-calc">Analytical keywords: "analyze", "impact", "implication", "explain why", "why is"<br>Triggered: <span class="t-val">${D.analyticalTriggered ? 'YES' : 'no'}</span><br>Length factor: ${D.wordCount} words<br>Formula: 0.6×(analytical?0.88:0.35) + 0.4×(length/18)</div>`},
      depthRequired: {v: D.depthRequired,
        tip: `<b>Answer Depth Required · ${pct(D.depthRequired)}</b>Does the user want a headline (quick fact) or a deep-dive analysis?<div class="t-calc">Depth keywords: "comprehensive", "detailed", "specific", "exactly", "full analysis"<br>Triggered: <span class="t-val">${D.depthKeywordsTriggered ? 'YES (0.92)' : D.complexity > 0.62 ? 'inferred from complexity (0.72)' : 'low (0.32)'}</span><br>High depth → penalize short articles; pay for long-form analysis.</div>`},
      questionType: {v: D.questionTypeScore, raw: D.questionType,
        tip: `<b>Question Type (Broder) · ${D.questionType}</b>Classic IR taxonomy from Broder 2002, cited in the FB paper.<div class="t-calc">Types:<br>• <b>Informational</b> — want facts/analysis → buy content (0.65)<br>• <b>Navigational</b> — want specific source → route directly (0.30)<br>• <b>Transactional</b> — want to do something → usually no purchase (0.48)<br>Detected: <span class="t-val">${D.questionType}</span></div>`},
      ambiguity: {v: D.ambiguity,
        tip: `<b>Ambiguity / Multi-angle · ${pct(D.ambiguity)}</b>Does the query need multiple perspectives to resolve? Ambiguous queries need diverse sources.<div class="t-calc">Ambiguity keywords: "versus", "vs.", "or", "different views", "both sides", "depends"<br>Triggered: <span class="t-val">${D.ambiguityTriggered ? 'YES (0.76)' : 'no (0.24)'}</span><br>Novel signal — not in FB paper or vLLM routing.</div>`},
      composed: D.composed,
    },
  };
}

/** True when HTML was fetched and chunk embeddings contributed (RAG path succeeded). */
function isFullRagHit(r) {
  return r && r.rag_status === 'ok' && r.rag_score != null;
}

/** One-line label under Relevance % — must match when we use title+snippet vs full RAG (see rag_coverage.py). */
function ragRelevanceSubLabel(r) {
  const st = r.rag_status;
  const rs = r.rag_score;
  if (rs != null && st === 'ok') return 'RAG max + snippet';
  if (st === 'skip_paywall') return 'Paywalled · snippet only';
  if (!st) return 'Snippet only';
  if (String(st).startsWith('fetch_failed')) return 'Fetch failed · snippet only';
  if (st === 'fetch_short') return 'Page too short · snippet only';
  if (st === 'no_chunks') return 'No body chunks · snippet only';
  if (st === 'embed_failed') return 'Embed failed · snippet only';
  if (st === 'not_fetched' || st === 'pending') return 'RAG incomplete · snippet only';
  if (st === 'no_url') return 'No URL · snippet only';
  return 'Snippet only';
}

function buildRagRelevanceTipHtml(r, subQuery) {
  const rs = r.rag_score;
  const st = r.rag_status || '';
  const ss = r.snippet_score;
  if (rs != null && st === 'ok') {
    return (
      '<b>RAG relevance score</b><div class="t-calc">The <b>sub-query</b> and each <b>page text chunk</b> are embedded with <code>sentence-transformers/all-MiniLM-L6-v2</code>. HTML is fetched (unless paywalled), text is extracted, split into overlapping word chunks (up to 10 per URL).<br><br>We compute <b>cosine similarity</b> between the query vector and each chunk vector, take the <b>maximum</b> over chunks, then map cosine from [-1,1] to [0,1].<br><br><b>Displayed relevance</b> = max(RAG, snippet-based score) so a strong title/snippet still counts.<br><br>Sub-query: <span class="t-val">' +
      escapeHtml(subQuery || '') +
      '</span><br>max RAG: <span class="t-val">' +
      escapeHtml(String(rs)) +
      '</span>' +
      (ss != null ? ' · snippet base: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  const snippetFormula =
    '<br><br><b>Snippet score (no full article)</b> combines: entity overlap in title+snippet vs. sub-query entities (40%), temporal signal if a date is present and freshness is required (25%), keyword-hit overlap from routing signals (20%), plus a small base (15%). Values are blended and rounded to [0,1].';
  if (st === 'skip_paywall') {
    return (
      '<b>Snippet-only relevance</b><div class="t-calc">This host is on the soft-paywall skip list; full HTML is not fetched. No RAG over page body.' +
      snippetFormula +
      (ss != null ? '<br>Snippet score here: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  if (String(st).startsWith('fetch_failed')) {
    return (
      '<b>Relevance (full article fetch failed)</b><div class="t-calc">The page could not be downloaded or parsed, so we cannot chunk/embed the body. The displayed number is the <b>snippet-based score only</b> (same formula as paywall skip).' +
      snippetFormula +
      '<br>Status: <code>' +
      escapeHtml(String(st)) +
      '</code>' +
      (ss != null ? '<br>Snippet score: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  if (st === 'fetch_short' || st === 'no_chunks') {
    return (
      '<b>Relevance (thin page)</b><div class="t-calc">Fetched text was too short to form useful chunks; we use the snippet heuristic instead.' +
      snippetFormula +
      (ss != null ? '<br>Snippet score: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  if (st === 'embed_failed') {
    return (
      '<b>Relevance (embedding failed)</b><div class="t-calc">Chunk vectors could not be computed; snippet score is used.' +
      snippetFormula +
      (ss != null ? '<br>Snippet score: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  if (!st) {
    return (
      '<b>Snippet-only relevance</b><div class="t-calc">No full-page RAG score for this row — common reasons: <code>BOOTK_DISABLE_RAG=1</code>, embedding model not loaded yet, or enrich did not set <code>rag_status</code>. The percent uses the <b>snippet heuristic</b> only (title + SERP snippet), not paywalled.' +
      snippetFormula +
      (ss != null ? '<br>Snippet score: <span class="t-val">' + escapeHtml(String(ss)) + '</span>' : '') +
      '</div>'
    );
  }
  return (
    '<b>Relevance</b><div class="t-calc">RAG status: <code>' +
    escapeHtml(String(st)) +
    '</code>. Displayed value is max(available RAG, snippet) when applicable. Raw RAG: ' +
    (rs != null ? '<span class="t-val">' + escapeHtml(String(rs)) + '</span>' : '—') +
    '</div>'
  );
}

function buildResearchCompletenessHtml(res) {
  const rc = (res.v4 || {}).research_completeness;
  if (!rc) return '';
  const tips = rc.tips || {};
  const pctRaw = rc.completeness_percent;
  const pct = pctRaw != null && !Number.isNaN(Number(pctRaw)) ? Number(pctRaw).toFixed(1) : '—';
  const nm = rc.need_more_information === true ? 'Yes' : rc.need_more_information === false ? 'No' : '—';
  const pctTip = registerTip(
    '<b>Research completeness (' + pct + '%)</b><div class="t-calc">' +
      escapeHtml(tips.completeness_percent || '') +
      '<br><br><b>How this number is computed</b><br>' +
      escapeHtml(tips.completeness_how || '') +
      '</div>'
  );
  const nmTip = registerTip(
    '<b>More information needed (' + nm + ')</b><div class="t-calc">' +
      escapeHtml(tips.need_more || '') +
      '<br><br><b>How this is decided</b><br>' +
      escapeHtml(tips.need_more_how || '') +
      '</div>'
  );
  const mode = rc.mode === 'llm' ? 'LLM critic' : 'Heuristic fallback';
  const modeTip = registerTip(
    '<b>Critic mode</b><div class="t-calc"><b>LLM critic</b> — an LLM scores completeness 0–1 from your original question plus a digest of free search results.<br><br><b>Heuristic fallback</b> — used when no LLM key is configured or the call fails. The percent blends how many sub-queries met their quality floor with the average best-hit relevance; “more info needed” uses gaps plus a low completeness threshold.</div>'
  );
  return `
    <div class="dr-critic-block">
      <div class="fanout-title">Research completeness <span class="fanout-badge" data-tipid="${modeTip}" style="cursor:help">${escapeHtml(mode)}</span></div>
      <div class="dr-critic-row">
        <div class="dr-critic-metric" data-tipid="${pctTip}">
          <span class="dr-critic-lbl">Completeness</span>
          <span class="dr-critic-val">${escapeHtml(pct)}%</span>
        </div>
        <div class="dr-critic-metric" data-tipid="${nmTip}">
          <span class="dr-critic-lbl">More info needed</span>
          <span class="dr-critic-val" style="font-size:15px">${escapeHtml(nm)}</span>
        </div>
      </div>
    </div>`;
}

function buildFanoutSplit(res, sigs) {
  const ft = getFanoutPillTips();
  const v4 = res.v4 || {};
  const runs = v4.sub_query_runs;
  const subs = sigs.sub_queries || [];
  const cov = v4.coverage != null ? String(v4.coverage) : '';

  if (!Array.isArray(runs) || !runs.length) {
    if (!Array.isArray(subs) || !subs.length) {
      return { subqueries: '', search: '', probe: '' };
    }
    const rows = subs.map((sq, i) => {
      const sg = sq.signals || {};
      const mp = sg.max_price_usd != null ? fmt$(sg.max_price_usd) : '—';
      const intent = sg.intent != null ? String(sg.intent) : '—';
      const domain = sg.domain != null ? String(sg.domain) : '—';
      const ctype = sg.content_type_needed != null ? String(sg.content_type_needed) : '';
      return `
      <div class="fanout-item" id="fanout-run-${i + 1}" data-sq-index="${i + 1}">
        <div class="fanout-item-hd">
          <span class="fanout-idx">${i + 1}</span>
          <div style="flex:1;min-width:0">
            <p class="fanout-q">${escapeHtml(sq.query || '')}</p>
            ${(sq.goal || sq.research_objective) ? fmtGoalBlockPair(sq.goal, sq.research_objective) : ''}
            <div class="fanout-meta">
              <span class="fanout-chip" data-tipid="${ft.intent}" style="cursor:help">intent: ${escapeHtml(intent)}</span>
              <span class="fanout-chip" data-tipid="${ft.domain}" style="cursor:help">domain: ${escapeHtml(domain)}</span>
              ${ctype ? `<span class="fanout-chip" data-tipid="${ft.content}" style="cursor:help">content: ${escapeHtml(ctype)}</span>` : ''}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
    return {
      subqueries: `
    <div class="fanout-block">
      <div class="fanout-title">
        <span class="fanout-title-tip" data-tipid="${ft.queryFanoutHeading}">Query fanout</span>
        <span class="fanout-badge">${subs.length} sub-queries</span>
      </div>
      ${rows}
    </div>`,
      search: '<div class="fanout-nores" style="padding:10px 0">Free search hits appear when the response includes <code>sub_query_runs</code>.</div>',
      probe: '<div class="fanout-nores" style="padding:10px 0">Paid source fetch rows appear here after a GAP sub-query triggers a paid-tier probe.</div>'
    };
  }

  const subParts = [];
  const searchParts = [];
  const probeParts = [];
  const probePriceTipId = registerTip(
    '<b>Paid source fetch rows</b><div class="t-calc"><b>Est. catalog</b> — rough per-article $ from our domain map (journals, news, markets, etc.); shown on every row for context.<br><br><b>Paid-only URL</b> — in the paid index for this query but not in the free index; Plan &amp; buy may use the catalog as an incremental paid ask when it is &gt; 0.<br><br><b>Also in free index</b> — same URL in both tiers: incremental ask is usually $0; catalog still shown.<br><br><b>Why one domain?</b> bootk does not restrict by publisher — if you only see one site, the paid index ranked those URLs highest for this sub-query.</div>'
  );
  runs.forEach((run) => {
    const sg = (subs.find(s => s.query === run.query) || {}).signals || {};
    const mp = sg.max_price_usd != null ? fmt$(sg.max_price_usd) : '—';
    const intent = sg.intent != null ? String(sg.intent) : '—';
    const domain = sg.domain != null ? String(sg.domain) : '—';
    const ctype = sg.content_type_needed != null ? String(sg.content_type_needed) : '';
    const freeList = run.free_results || [];
    const sortedFree = freeList.length
      ? [...freeList].sort((a, b) => {
          const bf = isFullRagHit(b) ? 1 : 0;
          const af = isFullRagHit(a) ? 1 : 0;
          if (bf !== af) return bf - af;
          return (Number(b.coverage_score) || 0) - (Number(a.coverage_score) || 0);
        })
      : [];
    const freeRows = sortedFree.length ? sortedFree.map(r => {
            const rel = r.coverage_score != null ? Number(r.coverage_score) : 0;
            const covPct = (rel * 100).toFixed(0);
            const w = Math.min(100, Math.max(0, rel * 100));
            const ragTipId = registerTip(buildRagRelevanceTipHtml(r, run.query || ''));
            const isPaywalled = r.rag_status === 'skip_paywall';
            const fullRag = isFullRagHit(r);
            const sub = ragRelevanceSubLabel(r);
            const tierBadge = fullRag
              ? `<span class="hit-tier-badge hit-tier-full" title="Full page HTML was fetched; body chunks were embedded (RAG).">Full page</span>`
              : `<span class="hit-tier-badge hit-tier-snippet" title="Relevance uses title + snippet only (paywall, fetch failure, or short page).">Snippet / partial</span>`;
            const paywallBadge = isPaywalled
              ? `<span class="fanout-res-paywall-badge" title="This domain is on our soft-paywall skip list; we do not fetch full HTML. Scoring uses the search title and snippet only.">Paywalled</span>`
              : '';
            const paywallNote = isPaywalled
              ? `<div class="fanout-res-paywall-note">Full article not retrieved — subscription / soft-paywall host. Text below is the search snippet only.</div>`
              : '';
            const rowExtra = fullRag ? ' fanout-res-rag-full' : (isPaywalled ? ' fanout-res-row-paywall' : ' fanout-res-row-snippet-only');
            return `
        <div class="fanout-res-row${rowExtra}">
          <div class="fanout-res-main">
            <div style="display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:2px">
              <a class="fanout-res-title" href="${escapeHtml(r.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0">${escapeHtml(r.title || '(No title)')}</a>
              ${tierBadge}
              ${paywallBadge}
            </div>
            <div class="fanout-res-meta">${escapeHtml(r.source || '—')}</div>
            ${paywallNote}
            ${r.snippet ? `<div class="fanout-res-snippet">${escapeHtml(r.snippet)}</div>` : ''}
          </div>
          <div class="rag-rel-box" data-tipid="${ragTipId}" title="Click for RAG fetch details" onclick='openRagOverlay(${JSON.stringify(r)})'>
            <div class="rag-rel-lbl">Relevance</div>
            <div class="rag-rel-num">${covPct}%</div>
            <div class="rag-rel-bar"><div style="width:${w.toFixed(1)}%"></div></div>
            <div class="rag-rel-sub">${escapeHtml(sub)}</div>
          </div>
        </div>`;
    }).join('') : '<div class="fanout-nores">No free-tier search results for this sub-query.</div>';
    const pb = run.probe || {};
    const plist = pb.results || [];
    const skipped = pb.skipped_reason || null;
    const attempted = pb.attempted === true;
    const valyuOk = (res.v4 || {}).valyu_configured === true;
    const vyuErr = pb.valyu_error;
    const onlyFree = pb.valyu_only_free_tier === true;
    const isGap = run.coverage_status === 'gap';
    const exaQ = pb.exa_quote || null;
    const exaErr = pb.exa_error || null;
    const exaQuoteHtml = isGap && exaQ
      ? `<div class="fanout-nores" style="margin-bottom:10px;line-height:1.6;border-left:2px solid rgba(56,139,253,.7);padding:6px 0 6px 10px">
          <div style="font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">Paid fetch — price estimate</div>
          <div style="font-size:13px;margin-bottom:3px"><b>${fmt$(Number(exaQ.total_usd || 0))}</b> to resolve this gap</div>
          <div style="font-size:10px;opacity:.7">${escapeHtml(exaQ.formula || '')} — fetch from Plan &amp; buy tab</div>
        </div>`
      : '';
    let probeHtml = '';
    if (exaErr) {
      probeHtml =
        '<div class="fanout-nores" style="line-height:1.5">Paid fetch failed.<br><span style="opacity:.85;font-size:10px">' +
        escapeHtml(String(exaErr)) +
        '</span></div>';
    } else if (plist.length) {
      probeHtml =
        `<div class="fanout-subhdr">Paid results — ${plist.length} article${plist.length !== 1 ? 's' : ''} fetched</div>
          ${plist.map(pr => `
          <div class="fanout-res">
            <a class="fanout-res-title" href="${escapeHtml(pr.url)}" target="_blank" rel="noopener">${escapeHtml(pr.title || '(No title)')}</a>
            <div class="fanout-res-meta">${escapeHtml(pr.source || '—')}${pr.date ? ' · ' + escapeHtml(String(pr.date).slice(0,10)) : ''}</div>
            ${pr.snippet ? `<div class="fanout-res-snippet">${escapeHtml(pr.snippet)}</div>` : ''}
          </div>`).join('')}`;
    } else if (skipped === 'free_tier_met' || run.coverage_status === 'ok') {
      probeHtml =
        '<div class="fanout-nores">Free search met the quality floor for this sub-query — no paid fetch needed.</div>';
    } else if (skipped === 'probe_budget_exhausted') {
      probeHtml =
        '<div class="fanout-nores">Paid fetch skipped — budget used by an earlier gap sub-query.</div>';
    } else if (skipped === 'probe_deadline_exceeded') {
      probeHtml =
        '<div class="fanout-nores">Paid fetch skipped — pipeline ran out of time.</div>';
    } else if (run.coverage_status === 'gap' && attempted && !plist.length) {
      probeHtml =
        '<div class="fanout-nores" style="line-height:1.55">Paid fetch returned no results for this sub-query. Try rephrasing the query.</div>';
    }
    const bcPct = run.best_coverage != null ? (run.best_coverage * 100).toFixed(0) : '—';
    const flPct = run.quality_threshold != null ? (run.quality_threshold * 100).toFixed(0) : '—';
    const gapLine = run.coverage_gap_detail
      ? `<div class="fanout-gap-line${isGap ? '' : ' fanout-ok-line'}">${escapeHtml(run.coverage_gap_detail)}</div>`
      : '';

    subParts.push(`
      <div class="fanout-item" id="fanout-run-${run.index}" data-sq-index="${run.index}">
        <div class="fanout-item-hd">
          <span class="fanout-idx">${run.index}</span>
          <div style="flex:1;min-width:0">
            <p class="fanout-q">${escapeHtml(run.query || '')}</p>
            ${(run.goal || run.research_objective) ? fmtGoalBlockPair(run.goal, run.research_objective) : ''}
            <div class="fanout-meta">
              <span class="fanout-chip" data-tipid="${ft.intent}" style="cursor:help">intent: ${escapeHtml(intent)}</span>
              <span class="fanout-chip" data-tipid="${ft.domain}" style="cursor:help">domain: ${escapeHtml(domain)}</span>
              ${ctype ? `<span class="fanout-chip" data-tipid="${ft.content}" style="cursor:help">content: ${escapeHtml(ctype)}</span>` : ''}
            </div>
          </div>
        </div>
      </div>`);
    const qHead = (run.query || '').length > 90 ? escapeHtml((run.query || '').slice(0, 90)) + '…' : escapeHtml(run.query || '');
    const qHeadCell = isGap
      ? `<span class="search-sq-query-link" role="button" tabindex="0" title="Open Price fetch tab for this sub-query (may need paid source)" onclick="event.preventDefault();event.stopPropagation();goToProbeSubquery(${run.index})">${qHead}</span>`
      : `<span>${qHead}</span>`;
    const covPill = isGap
      ? `<button type="button" class="search-cov-pill search-cov-gap" title="Sub-query #${run.index} is not covered by free content — best relevance (${bcPct}%) is below the quality floor (${flPct}%). A paid source may be needed. Click to see Price fetch." onclick="event.preventDefault();event.stopPropagation();goToProbeSubquery(${run.index})">GAP</button><span class="search-cov-meta">best ${bcPct}% · floor ${flPct}%</span>`
      : `<span class="search-cov-pill search-cov-ok">OK</span><span class="search-cov-meta">best ${bcPct}% · floor ${flPct}%</span>`;
    const probeBtn = isGap
      ? `<button type="button" class="search-pricefetch-jump" data-pricefetch-jump="${run.index}" onclick="event.preventDefault();event.stopPropagation();goToProbeSubquery(${run.index})" title="Open paid source fetch tab">Price fetch →</button>`
      : '';
    searchParts.push(`
      <details class="fanout-search-details${isGap ? ' fanout-search-gap' : ''}" data-sq-index="${run.index}" id="search-sq-${run.index}">
        <summary class="fanout-search-sum">
          <span class="fanout-idx" style="margin-right:6px">${run.index}</span>
          <span style="flex:1;min-width:0">${qHeadCell}</span>
          ${covPill}
          <span style="color:var(--text-muted);font-size:9px">${freeList.length} hits</span>
          ${probeBtn}
        </summary>
        <div class="fanout-search-body">
          ${gapLine}
          <div class="fanout-subhdr">Hits with <b>full-page RAG</b> are listed first. Badges show <b>Full page</b> vs <b>Snippet / partial</b>. Hover <b>Relevance</b> for the score breakdown (snippet formula when fetch fails).</div>
          ${freeRows}
        </div>
      </details>`);

    const probeBody =
      `<div id="probe-exa-body-${run.index}">` +
      exaQuoteHtml + (
      probeHtml ||
      `<div class="fanout-nores">No paid sources fetched</div>`) +
      `</div>`;
    const ceilingChip = isGap && mp !== '—' && mp !== '$0.000'
      ? `<span class="fanout-chip" data-tipid="${ft.ceiling}" style="cursor:help;font-variant-numeric:tabular-nums;letter-spacing:.02em">bid ceiling&nbsp;${escapeHtml(mp)}</span>`
      : '';
    const covForProbe = isGap
      ? `<div class="hit-cov-badge hit-cov-gap" style="margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
           <span><b>GAP</b> — best ${bcPct}% · floor ${flPct}% · paid source may be needed</span>
           ${ceilingChip}
           <button type="button" onclick="switchMainTab('plan')" style="margin-left:auto;flex-shrink:0;background:rgba(57,211,83,.12);border:1px solid rgba(57,211,83,.3);color:var(--accent);font-size:9px;padding:2px 8px;border-radius:3px;cursor:pointer;font-family:inherit;letter-spacing:.04em">Plan &amp; buy →</button>
         </div>`
      : `<div class="hit-cov-badge hit-cov-ok" style="margin-bottom:8px"><b>OK</b> — floor met</div>`;
    probeParts.push(`
      <div class="fanout-item" id="probe-run-${run.index}" data-sq-index="${run.index}">
        <div class="fanout-item-hd">
          <span class="fanout-idx">${run.index}</span>
          <div style="flex:1;min-width:0">
            <p class="fanout-q">${escapeHtml(run.query || '')}</p>
            ${covForProbe}
            ${probeBody}
          </div>
        </div>
      </div>`);
  });

  const gapIndices = runs.filter(r => r.coverage_status === 'gap').map(r => r.index);
  let searchLegend = '';
  if (runs.length) {
    if (gapIndices.length) {
      const gapLead =
        gapIndices.length === 1
          ? `Sub-query <b>#${gapIndices[0]}</b> is`
          : `Sub-queries <b>${gapIndices.map(i => '#' + i).join(', ')}</b> are`;
      searchLegend =
        `<div class="search-coverage-legend search-coverage-legend-gap"><span style="display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">Free-tier coverage</span>` +
        `${gapLead} not covered by free content — relevance is still below the quality floor, so a <b>paid</b> source may be needed. See the <b>GAP</b> pill on each affected sub-query, or jump to <b>Price fetch</b> for details.</div>`;
    } else {
      searchLegend =
        '<div class="search-coverage-legend search-coverage-legend-allok"><span style="display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">Free-tier coverage</span>All sub-queries: <b>OK</b> — best free hit met or exceeded the quality floor (or no hits to compare).</div>';
    }
  }

  const covBadge = cov ? coverageBadgeTipRegister(cov) : null;
  const titleRow = (label, labelTipId, includeCoverage) => {
    const showCov = includeCoverage !== false && covBadge;
    const lab = labelTipId
      ? `<span class="fanout-title-tip" data-tipid="${labelTipId}">${escapeHtml(label)}</span>`
      : escapeHtml(label);
    return `
      <div class="fanout-title">
        ${lab}
        <span class="fanout-badge">${runs.length} sub-queries</span>
        ${
          showCov
            ? `<span class="fanout-badge${covBadge.warn ? ' fanout-badge-warn' : ''}" data-tipid="${covBadge.tipId}" style="cursor:help">coverage ${escapeHtml(cov)}</span>`
            : ''
        }
      </div>`;
  };

  return {
    subqueries: `<div class="fanout-block">${titleRow('Query fanout', ft.queryFanoutHeading, false)}${subParts.join('')}</div>`,
    search: `<div class="fanout-block">${titleRow('Free search')}${searchLegend}${searchParts.join('')}</div>`,
    probe: `<div class="fanout-block">${titleRow('Paid source fetch')}${probeParts.join('')}</div>`
  };
}

function buildPlanTabHtml(res) {
  const sigs = res.sigs || {};
  const runs = res.v4?.sub_query_runs || [];
  const allScored = res.allScored || [];
  const bid_ceiling = res.bid_ceiling;
  const gaps = runs.filter(r => r.coverage_status === 'gap' && r.probe?.exa_quote);
  const okRuns = runs.filter(r => r.coverage_status !== 'gap');
  const exaProjected = gaps.reduce((sum, g) => sum + (g.probe.exa_quote.total_usd || 0), 0);
  const allPaidCost = runs.length * 0.007;

  // ── Free sources block (collapsed by default) ──────────────────────────
  const freeSources = runs.flatMap(r =>
    (r.free_results || []).map(fr => ({...fr, _sq: r.query, _sq_idx: r.index}))
  ).filter(fr => fr.url);
  const coveredCount = okRuns.length;
  const totalRuns = runs.length;
  const covColor = coveredCount === totalRuns ? 'var(--green)' : coveredCount > 0 ? '#e3b341' : 'var(--red)';
  const freeSourcesHtml = freeSources.length ? `
    <details class="plan-section-details" style="margin-bottom:12px">
      <summary class="plan-section-hdr" style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between">
        <span style="font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase">Free sources <span style="color:var(--text-dim);font-weight:400">(${freeSources.length} scraped)</span> <span style="color:${covColor};font-weight:600">${coveredCount}/${totalRuns} covered</span></span>
        <span style="font-size:9px;color:var(--text-muted)">▼</span>
      </summary>
      <div style="margin-top:8px;display:flex;flex-direction:column;gap:6px">
        ${freeSources.map(fr => {
          const cov = fr.coverage_score != null ? Math.round(fr.coverage_score * 100) : null;
          const covColor = cov == null ? 'var(--text-muted)' : cov >= 85 ? 'var(--green)' : cov >= 65 ? '#e3b341' : 'var(--red)';
          return `<div style="padding:6px 8px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;display:flex;align-items:flex-start;gap:8px">
            <div style="flex:1;min-width:0">
              <a href="${escapeHtml(fr.url)}" target="_blank" rel="noopener" class="fanout-res-title" style="font-size:11px">${escapeHtml(fr.title || fr.url)}</a>
              <div style="font-size:9px;color:var(--text-muted);margin-top:2px">${escapeHtml(fr.source || new URL(fr.url).hostname)} · sq #${fr._sq_idx}</div>
              ${fr.snippet ? `<div style="font-size:10px;color:var(--text-dim);margin-top:3px;line-height:1.4">${escapeHtml((fr.snippet||'').slice(0,140))}${(fr.snippet||'').length>140?'…':''}</div>` : ''}
            </div>
            ${cov != null ? `<span style="flex-shrink:0;font-size:10px;font-weight:600;color:${covColor}">${cov}%</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </details>` : '';

  // ── Coverage gap cards ─────────────────────────────────────────────────
  const gapCardsHtml = gaps.length ? `
    <div style="font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Purchase plan — coverage gaps</div>
    ${gaps.map(g => {
      const q = g.probe.exa_quote;
      const fetchId = 'plan-exa-' + g.index;
      const bcPct = g.best_coverage != null ? Math.round(g.best_coverage * 100) : 0;
      const flPct = g.quality_threshold != null ? Math.round(g.quality_threshold * 100) : 0;
      const shortfall = flPct - bcPct;
      return `<div id="gap-card-${g.index}" style="padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
          <span style="font-size:9px;color:var(--text-muted)">Sub-query #${g.index}</span>
          <span id="gap-status-${g.index}" style="font-size:9px;padding:1px 6px;background:rgba(248,81,73,.12);color:var(--red);border:1px solid rgba(248,81,73,.25);border-radius:3px">GAP</span>
        </div>
        <div style="font-size:11px;margin-bottom:8px;line-height:1.4;color:var(--text)">${escapeHtml(g.query || '')}</div>
        <div id="gap-cov-line-${g.index}" style="font-size:10px;color:var(--text-muted);margin-bottom:8px">Free coverage <b style="color:var(--text-dim)">${bcPct}%</b> · floor <b style="color:var(--text-dim)">${flPct}%</b> · fetch could add <b style="color:var(--green)">+${shortfall}pp</b></div>
        <div id="gap-action-${g.index}" style="display:flex;align-items:center;gap:10px">
          <button class="exa-fetch-btn" data-query="${escapeHtml(g.query || '')}" data-target="${fetchId}" data-sq-index="${g.index}" data-floor="${g.quality_threshold}" data-base-cov="${g.best_coverage}" style="padding:5px 14px;background:#58a6ff;color:#000;border:none;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.04em">Fetch paid source ${fmt$(Number(q.total_usd || 0))} →</button>
        </div>
        <div id="${fetchId}" style="margin-top:8px"></div>
      </div>`;
    }).join('')}` : `<div style="font-size:10px;color:var(--text-muted);padding:4px 0 12px">No coverage gaps — free sources met the quality floor for all sub-queries.</div>`;

  // ── Projected cost ─────────────────────────────────────────────────────
  const costHtml = `
    <div style="font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px">Projected cost</div>
    <div class="mc" style="margin-bottom:12px">
      <div class="mc-lbl">Estimated spend to resolve gaps</div>
      <div class="mc-val" id="exaCostDisplay" data-projected="${exaProjected}" data-all-paid="${allPaidCost}" data-n-runs="${runs.length}" style="color:var(--green)">${fmt$(exaProjected)}</div>
      <div class="mc-sub" id="exaCostSub">${gaps.length} gap${gaps.length !== 1 ? 's' : ''} × ${fmt$(0.007)} paid fetch${gaps.length === 0 ? ' · free sources sufficient' : ''}</div>
      <div id="exaSavingsLine" style="font-size:10px;color:var(--text-muted);margin-top:4px">${runs.length > gaps.length ? `${runs.length - gaps.length}/${runs.length} sub-queries free · ${fmt$(exaProjected)} vs ${fmt$(allPaidCost)} all-paid` : ''}</div>
    </div>`;

  // ── Signal-Derived Thresholds (with link to signals tab) ───────────────
  const thresholdsHtml = `
    <div style="font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin:12px 0 6px;display:flex;align-items:center;justify-content:space-between">
      <span>Signal-derived thresholds</span>
      <button onclick="switchMainTab('signals')" style="background:none;border:none;color:#58a6ff;font-size:9px;cursor:pointer;padding:0;font-family:inherit;letter-spacing:.04em">→ view signals</button>
    </div>
    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:4px 10px">
      <div class="roi-row"><span class="rl">Quality floor</span><span class="rv">${pct(sigs.qualityThreshold != null ? sigs.qualityThreshold : 0)} <span style="color:var(--text-muted);font-size:9px">(from credibility)</span></span></div>
      <div class="roi-row"><span class="rl">Max source age</span><span class="rv">${(sigs.maxFreshnessHours != null && sigs.maxFreshnessHours>=9999)?'unlimited':(sigs.maxFreshnessHours != null ? sigs.maxFreshnessHours+'h' : '—')} <span style="color:var(--text-muted);font-size:9px">(from freshness)</span></span></div>
      <div class="roi-row"><span class="rl">Min sources</span><span class="rv">${sigs.minSources != null ? sigs.minSources : '—'} <span style="color:var(--text-muted);font-size:9px">(from corroboration)</span></span></div>
    </div>`;

  // ── Bidding tab ────────────────────────────────────────────────────────
  // Build per-gap paywall rows: only sub-queries with a coverage gap and paywalled URLs
  function isActualPaywall(fr) {
    const st = (fr.rag_status || '');
    if (st === 'skip_paywall') return true;
    // fetch_failed:403 or fetch_failed:401 = HTTP access denied = real paywall
    if (st.startsWith('fetch_failed:')) {
      const reason = st.slice('fetch_failed:'.length).toLowerCase();
      return reason.includes('403') || reason.includes('401') || reason.includes('paywall');
    }
    return false;
  }
  const paywallRuns = runs.map(r => {
    const paywalled = (r.free_results || []).filter(isActualPaywall);
    return { run: r, paywalled };
  }).filter(x => x.paywalled.length > 0 || (x.run.coverage_status === 'gap' && x.run.max_price_usd));

  const bidCeilStr = bid_ceiling != null ? `$${bid_ceiling.toFixed(3)}` : '—';
  const bidCeilLabel = bid_ceiling != null ? `Value ceiling: ${bidCeilStr} <span style="font-size:9px;color:var(--text-muted)">(from stakes × credibility × freshness)</span>` : '';

  const paywallCardsHtml = paywallRuns.length === 0
    ? `<div style="color:var(--text-muted);font-size:11px;padding:12px 0">No paywalled content detected in this run.</div>`
    : paywallRuns.map(({ run, paywalled }) => {
        const ceil = run.max_price_usd != null ? `$${Number(run.max_price_usd).toFixed(4)}` : bidCeilStr;
        const isGap = run.coverage_status === 'gap';
        const chipColor = isGap ? 'var(--red)' : '#e3b341';
        const chipLabel = isGap ? 'GAP' : 'PARTIAL';
        const urlRows = paywalled.map(fr => {
          const host = (() => { try { return new URL(fr.url).hostname; } catch(e) { return fr.url; } })();
          const statusLabel = (fr.rag_status || '').startsWith('fetch_failed') ? 'paywall' : 'snippet only';
          return `<div style="padding:5px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;min-width:0">
            <div style="flex:1;min-width:0;overflow:hidden">
              <a href="${escapeHtml(fr.url)}" target="_blank" rel="noopener" style="font-size:10px;color:var(--accent);text-decoration:none;word-break:break-all">${escapeHtml(fr.title || host)}</a>
              <div style="font-size:9px;color:var(--text-muted);margin-top:1px">${escapeHtml(host)}</div>
            </div>
            <span style="flex-shrink:0;font-size:8px;padding:2px 5px;background:rgba(220,38,38,.12);color:#f87171;border:1px solid rgba(220,38,38,.25);border-radius:3px;white-space:nowrap">${statusLabel}</span>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:12px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-size:8px;padding:2px 5px;background:${isGap ? 'rgba(220,38,38,.12)' : 'rgba(227,179,65,.12)'};color:${chipColor};border:1px solid ${isGap ? 'rgba(220,38,38,.3)' : 'rgba(227,179,65,.3)'};border-radius:3px;font-weight:600;letter-spacing:.05em">${chipLabel}</span>
            <span style="font-size:10px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(run.query)}</span>
            <span style="flex-shrink:0;font-size:10px;color:var(--green);font-variant-numeric:tabular-nums">ceil ${ceil}</span>
          </div>
          <div style="font-size:9px;color:var(--text-muted);margin-bottom:6px">${paywalled.length} blocked source${paywalled.length !== 1 ? 's' : ''}</div>
          ${urlRows}
        </div>`;
      }).join('');

  return `
  <div class="fade-in">
    <div class="right-tabs">
      <div class="right-tab active" data-tab="plan" onclick="switchRightTab('plan')">Plan</div>
      <div class="right-tab" data-tab="bidding" onclick="switchRightTab('bidding')">Bidding <span style="font-size:8px;padding:1px 5px;background:rgba(57,211,83,.15);color:var(--accent);border:1px solid rgba(57,211,83,.3);border-radius:3px;vertical-align:middle;letter-spacing:.05em">BETA</span></div>
    </div>
    <div id="rightPlanContent" class="right-tab-content">
      ${freeSourcesHtml}
      ${gapCardsHtml}
      ${costHtml}
      ${thresholdsHtml}
    </div>
    <div id="rightBidContent" class="right-tab-content" style="display:none">
      ${bidCeilLabel ? `<div class="bid-ceil">${bidCeilLabel}</div>` : ''}
      <div style="font-size:9px;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px">Paywalled content by sub-query</div>
      ${paywallCardsHtml}
    </div>
  </div>`;
}

let currentMainTab = 'signals';

function switchMainTab(tab, opts) {
  currentMainTab = tab;
  document.querySelectorAll('.pipe-step').forEach(t => {
    t.classList.toggle('active', t.dataset.mainTab === tab);
  });
  const map = { subqueries: 'mtpSubqueries', signals: 'mtpSignals', search: 'mtpSearch', probe: 'mtpProbe', plan: 'mtpPlan', answer: 'mtpAnswer' };
  Object.entries(map).forEach(([k, id]) => {
    const el = document.getElementById(id);
    if (el) el.style.display = k === tab ? 'block' : 'none';
  });
  if (!opts || !opts.silent) appendPipelineLogLine(null, 'Tab · ' + tab);
}
